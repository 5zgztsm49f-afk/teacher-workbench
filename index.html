      <td>${esc(s['出生日期'] || '')}</td><td>${esc(s['户口'] || '')}</td><td>${esc(s['本地'] || '')}</td><td>${esc(s['社区'] || '')}</td>
      <td>${esc(s['父亲姓名'] || '')}</td><td>${esc(s['父亲联系电话'] || '')}</td><td>${esc(s['母亲姓名'] || '')}</td><td>${esc(s['母亲联系电话'] || '')}</td>

    <div class="hint" style="margin-top:6px">显示 ${list.length} / ${DB.students.length} 人</div>`;
}
function stuDetail(i){ const s = DB.students[i];

function exportStudents(){

function renderSeats(){

    let from = null;
    cell.ondragstart = e => { from = cell; e.dataTransfer.effectAllowed = 'move'; };

function autoSeat(){
  const names = studentNames();
  if (!names.length) return toast('请先在「学生信息」导入学生名单', 'warn');
  const m = SEAT_MODES[DB.seats.mode];
  if (names.length > m.rows * m.cols) return toast('座位不足（' + names.length + '人 > ' + m.rows * m.cols + '座），请选择更大的排列方式', 'err');
  const req = DB.seats.req || '';
  // 保存历史版本
  if (DB.seats.grid && DB.seats.grid.some(r => r.some(c => c))) DB.seats.versions.unshift({ time: new Date().toLocaleString('zh-CN'), grid: JSON.parse(JSON.stringify(DB.seats.grid)) });
  // 识别约束
  const notTogether = [...req.matchAll(/([\u4e00-\u9fa5]{2,4})(?:和|与)([\u4e00-\u9fa5]{2,4})(不能坐在一起|不能同桌|不能同位)/g)].map(x => [x[1], x[2]]);
  const toFront = [...req.matchAll(/([\u4e00-\u9fa5]{2,4})[^，。;；]*?(第一排|前排|靠近讲台)/g)].map(x => x[1]);
  const talkative = [...req.matchAll(/([\u4e00-\u9fa5]{2,4})话多/g)].map(x => x[1]);
  const frontSet = new Set([...toFront, ...talkative]);
  // 基础分配：随机洗牌（模拟身高排序，可后续按身高字段优化），男女尽量搭配
  const stu = DB.students.filter(s => s['姓名']);
  const boysN = stu.filter(s => s['性别'] === '男').map(s => s['姓名']);
  const girlsN = stu.filter(s => s['性别'] !== '男').map(s => s['姓名']);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const order = []; const bs = shuffle(boysN), gs = shuffle(girls);
  while (bs.length || gs.length){ if (bs.length) order.push(bs.shift()); if (gs.length) order.push(gs.shift());
    if (bs.length) order.push(bs.shift()); if (gs.length) order.push(gs.shift()); }
  const grid = seatGridInit(DB.seats.mode);
  // 前排优先安排 frontSet
  const frontStudents = order.filter(n => frontSet.has(n));
  const rest = order.filter(n => !frontSet.has(n));
  let placed = [];
  const place = (name, r, c) => { grid[r][c] = name; placed.push(name); };
  const cells = [];
  for (let r = 0; r < m.rows; r++) for (let c = 0; c < m.cols; c++) cells.push([r, c]);
  let ci = 0;
  frontStudents.forEach(n => { const [r, c] = cells[ci++]; place(n, r, c); });
  // 不能同桌约束检查
  rest.forEach(n => {
    let [r, c] = cells[ci++];
    const bad = notTogether.filter(pair => pair.includes(n)).flat().filter(x => x !== n);
    let guard = 0;
    while (guard++ < 20){ const l = grid[r][c - 1], rr = grid[r][c + 1];
      if (bad.includes(l) || bad.includes(rr)){ ci++; [r, c] = cells[ci] || cells[ci - 1]; } else break; }
    place(n, r, c); });
  DB.seats.grid = grid; dbSave(); renderSeats();
  toast('自动排座完成' + (notTogether.length || frontSet.length ? `（已应用约束：不能同桌${notTogether.length}组、前排关注${frontSet.size}人）` : '（基础规则：男女搭配、轮换随机化）'));
}

  openModal('座位表历史版本', DB.seats.versions.slice(0, 10).map((v, i) => `

function moralFiltered(){
  const s = $('#moStu').value, f = $('#moFrom').value, t = $('#moTo').value, ty = $('#moType').value, c = $('#moCat').value, v = $('#moVal').value;
  return DB.moral.filter(x => (!s || x.student === s) && (!f || x.date >= f) && (!t || x.date <= t) &&
    (!ty || x.type === ty) && (!c || x.category === c) && (!v || Math.abs(x.score) === +v)); }
function moralScore(){ const m = {}; DB.moral.forEach(x => m[x.student] = (m[x.student] || 0) + x.score); return m; }
function renderMoralDash(){
  const now = todayStr(); const month = now.slice(0, 7);
  const all = moralScore(); const total = Object.values(all).reduce((a, b) => a + b, 0);
  const tAdd = DB.moral.filter(x => x.date === now && x.score > 0).reduce((a, b) => a + b.score, 0);
  const tSub = DB.moral.filter(x => x.date === now && x.score < 0).reduce((a, b) => a + b.score, 0);
  const mAdd = DB.moral.filter(x => x.date.startsWith(month) && x.score > 0).reduce((a, b) => a + b.score, 0);
  const mSub = DB.moral.filter(x => x.date.startsWith(month) && x.score < 0).reduce((a, b) => a + b.score, 0);
  $('#moDash').innerHTML = `<div class="grid g4">
    <div class="stat-card"><div class="num">${total}</div><div class="lab">全班总积分</div></div>
    <div class="stat-card mint"><div class="num">+${tAdd}</div><div class="lab">今日加分</div></div>
    <div class="stat-card lav"><div class="num">${tSub}</div><div class="lab">今日减分</div></div>
    <div class="stat-card butter"><div class="num">+${mAdd} / ${mSub}</div><div class="lab">本月加分 / 减分</div></div></div>`;
}
function renderMoralList(){
  const el = $('#moList'); if (!el) return;

  if (!list.length) return el.innerHTML = `<div class="empty">暂无加减分记录</div>`;

function renderAgencyProjects(){

  const projects = DB.agencyFee.projects || [];

  el.innerHTML = projects.map((pj, pi) => {
    const records = (DB.agencyFee.records || []).filter(r => r.projectId === pj.id);
    const incomeRecs = records.filter(r => r.type === 'income');
    const paidIds = new Set(incomeRecs.map(r => r.studentId));
    const totalIncome = incomeRecs.reduce((s, r) => s + (r.amount || 0), 0);
    const totalExpense = records.filter(r => r.type === 'expense').reduce((s, r) => s + (r.amount || 0), 0);
    const balance = totalIncome - totalExpense;
    const studentCount = DB.students.length;
    const paidCount = paidIds.size;
    return `<div class="card" style="margin-bottom:14px;border-left:4px solid ${pj.status === '进行中' ? '#4ECDC4' : pj.status === '已完成' ? '#95E1D3' : '#F38181'}">
      <div class="card-title" style="cursor:pointer" onclick="toggleAgencyProj(${pi})">

        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">

          <b style="color:#3D7A62">标准：¥${(pj.amount || 0).toFixed(2)}</b>
          <span class="hint">${pj.deadline ? '截止 ' + fmtCN(pj.deadline) : ''} · ${pj.note || ''}</span>
          <span style="margin-left:auto;font-size:15px;color:#3D7A62;font-weight:700">${paidCount}/${studentCount}</span>
          <span class="hint">已缴/总人数</span>
          <span class="arrow" id="agencyArr${pi}" style="transition:transform .2s">▶</span>

          <select id="agencyFilter${pi}"><option value="all">全部学生</option><option value="unpaid">仅未交</option><option value="paid">已交</option></select>
          <button class="btn sm ghost" onclick="agencySelectAll(${pi},true)">全选</button>
          <button class="btn sm ghost" onclick="agencySelectAll(${pi},false)">取消全选</button>
          <button class="btn sm mint" onclick="agencyBatchMarkPaid(${pi})">✅ 批量标记已缴</button>
          <span class="sp"></span>
          <span class="hint">余额：<b style="color:${balance >= 0 ? '#3D7A62' : '#C0392B'}">¥${balance.toFixed(2)}</b>（收入 ¥${totalIncome.toFixed(2)} - 支出 ¥${totalExpense.toFixed(2)}）</span>
        </div>
        <div id="agencyStuList${pi}"></div>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">

function toggleAgencyProj(pi){
  const body = $('#agencyBody' + pi), arr = $('#agencyArr' + pi);
  if (!body) return;
  const show = body.style.display !== 'block';
  body.style.display = show ? 'block' : 'none';
  if (arr) arr.style.transform = show ? 'rotate(90deg)' : '';
  if (show){ renderAgencyStuList(pi); $('#agencyKw' + pi).oninput = () => renderAgencyStuList(pi);
    $('#agencyFilter' + pi).onchange = () => renderAgencyStuList(pi); }
}
function renderAgencyStuList(pi){
  const el = $('#agencyStuList' + pi); if (!el) return;
  const pj = DB.agencyFee.projects[pi]; if (!pj) return;
  const kw = ($('#agencyKw' + pi) ? $('#agencyKw' + pi).value.trim() : '');
  const filt = $('#agencyFilter' + pi) ? $('#agencyFilter' + pi).value : 'all';
  const records = (DB.agencyFee.records || []).filter(r => r.projectId === pj.id);
  const paidSet = new Set(records.filter(r => r.type === 'income').map(r => r.studentId));
  let list = DB.students.filter(s => (!kw || (s['姓名'] || '').includes(kw) || (s['学号'] || '').includes(kw)));
  if (filt === 'unpaid') list = list.filter(s => !paidSet.has(s['学号'] || s['姓名']));
  else if (filt === 'paid') list = list.filter(s => paidSet.has(s['学号'] || s['姓名']));
  if (!list.length) return el.innerHTML = `<div class="empty">${DB.students.length ? '没有符合条件的学生' : '请先导入学生信息'}</div>`;
  el.innerHTML = `<div class="table-wrap"><table class="tb agency-tb"><tr><th style="width:36px"><input type="checkbox" onchange="agencySelectAll(${pi},this.checked)"></th>
    <th>学号</th><th>姓名</th><th>状态</th><th style="width:120px">实收金额</th><th>备注</th><th class="no-print">操作</th></tr>
    ${list.map(s => {
      const sid = s['学号'] || '', sname = s['姓名'] || '';
      const isPaid = paidSet.has(sid) || paidSet.has(sname);
      const rec = records.find(r => (r.studentId === sid || r.studentId === sname) && r.type === 'income');
      return `<tr class="${isPaid ? 'agency-paid' : ''}">
        <td><input type="checkbox" class="agency-chk" data-sid="${esc(sid)}" data-sname="${esc(sname)}" ${isPaid ? 'checked disabled' : ''}></td>
        <td>${esc(sid)}</td><td><b>${esc(sname)}</b></td>
        <td><span class="tag ${isPaid ? 'mint' : 'pink'}">${isPaid ? '✅ 已缴' : '⏳ 未缴'}</span></td>
        <td><input type="number" class="agency-amt" data-sid="${esc(sid)}" data-sname="${esc(sname)}" value="${isPaid && rec ? rec.amount : (pj.amount || '')}" step="0.01" min="0" ${isPaid ? 'disabled' : ''} style="width:100px"></td>
        <td><span class="hint">${isPaid && rec ? esc(rec.note || '') : '—'}</span></td>
        <td class="no-print">${!isPaid ? `<button class="btn sm mint" onclick="agencyMarkOnePaid(${pi},'${esc(sid)}','${esc(sname)}')">标记已缴</button>` : '<span class="hint">—</span>'}</td>
      </tr>`;
    }).join('')}</table></div>
    <div class="hint" style="margin-top:6px">显示 ${list.length} / ${DB.students.length} 人 · 可修改每位学生的实收金额后点「标记已缴」或使用批量操作</div>`;
}
function agencySelectAll(pi, checked){
  $$('#agencyStuList' + pi + ' .agency-chk:not(:disabled)').forEach(c => { c.checked = checked; });
}
function agencyMarkOnePaid(pi, sid, sname){
  const pj = DB.agencyFee.projects[pi]; if (!pj) return;
  const inp = document.querySelector(`.agency-amt[data-sid="${sid}"]`);
  const amount = inp ? parseFloat(inp.value) || 0 : (pj.amount || 0);
  if (amount <= 0) return toast('请输入有效金额', 'warn');
  DB.agencyFee.records = DB.agencyFee.records || [];
  DB.agencyFee.records.push({ id: uid(), projectId: pj.id, studentId: sid || sname, amount, type: 'income',
    date: todayStr(), note: `${sname || sid} 缴纳 ${pj.name}` });
  dbSave(); renderAgencyProjects(); renderAgencyBalance();
  toast(`已标记 ${sname || sid} 已缴纳 ¥${amount.toFixed(2)}`);
}
function agencyBatchMarkPaid(pi){
  const pj = DB.agencyFee.projects[pi]; if (!pj) return;
  const checked = $$('#agencyStuList' + pi + ' .agency-chk:checked');
  if (!checked.length) return toast('请先勾选要标记的学生', 'warn');
  let count = 0;
  DB.agencyFee.records = DB.agencyFee.records || [];
  checked.forEach(c => {
    const sid = c.dataset.sid, sname = c.dataset.sname;
    const inp = document.querySelector(`.agency-amt[data-sid="${sid}"]`);
    const amount = inp ? parseFloat(inp.value) || 0 : (pj.amount || 0);
    if (amount <= 0) return;
    DB.agencyFee.records.push({ id: uid(), projectId: pj.id, studentId: sid || sname, amount, type: 'income',
      date: todayStr(), note: `${sname || sid} 缴纳 ${pj.name}` });
    count++;
  });
  dbSave(); renderAgencyProjects(); renderAgencyBalance();
  toast(`已批量标记 ${count} 人已缴费`);
}

function saveAgencyProject(pi){

/* ---- 导出 ---- */
function exportAgencyRecords(){
  const records = DB.agencyFee.records || [];
  const projects = DB.agencyFee.projects || [];
  const pjMap = {}; projects.forEach(p => pjMap[p.id] = p.name);
  exportCSV('代收费收支明细', [['记录ID','项目','类型','学生/事由','金额','日期','备注'],
    ...records.map(r => [r.id, pjMap[r.projectId] || r.projectId, r.type === 'income' ? '收入' : '支出',
      r.studentId || '', r.amount, r.date, r.note])]);
}
function exportAgencyCSV(pi){
  const pj = DB.agencyFee.projects[pi]; if (!pj) return;
  const records = (DB.agencyFee.records || []).filter(r => r.projectId === pj.id);
  const rows = [['学号','姓名','状态','金额','日期','备注']];
  DB.students.forEach(s => {
    const sid = s['学号'] || '', sname = s['姓名'] || '';
    const rec = records.find(r => (r.studentId === sid || r.studentId === sname) && r.type === 'income');
    rows.push([sid, sname, rec ? '已缴' : '未缴', rec ? rec.amount : '', rec ? rec.date : '', rec ? rec.note : '']);
  });
  exportCSV(pj.name + '_缴费明细', rows);
}
function printAgencyBalance(){
  const projects = DB.agencyFee.projects || [];
  const records = DB.agencyFee.records || [];
  const pjMap = {}; projects.forEach(p => pjMap[p.id] = p.name);
  let html = `<h2>代收费余额总览</h2><p>生成时间：${new Date().toLocaleString('zh-CN')}</p>`;
  projects.forEach(pj => {
    const prs = records.filter(r => r.projectId === pj.id);
    const inc = prs.filter(r => r.type === 'income').reduce((s,r) => s+r.amount, 0);
    const exp = prs.filter(r => r.type === 'expense').reduce((s,r) => s+r.amount, 0);
    html += `<h3>${esc(pj.name)}（${esc(pj.status)}）</h3><table><tr><th>收入</th><th>支出</th><th>余额</th></tr>
      <tr><td>¥${inc.toFixed(2)}</td><td>¥${exp.toFixed(2)}</td><td>¥${(inc-exp).toFixed(2)}</td></tr></table>`;
  });
  printEl({ innerHTML: html });
}

/* ---------- 联动数据摘要 ---------- */
function docLinkedSummaries(){
  const out = {};
  // 学情分析
  if ($('#dwLk_study') && !$('#dwLk_study').checked) {} else {
    const ex = DB.subjectExams;
    if (ex.length){
      const cur = ex[ex.length - 1];
      const T = cur.totalScore || (cur.maxPer || []).reduce((a, b) => a + b, 0) || 100;
      const avg = (cur.rows.reduce((s, r) => s + (r.total || 0), 0) / cur.rows.length).toFixed(1);
      let ap = 0, below = 0;
      cur.rows.forEach(r => { const ra = (r.total || 0) / T; if (ra >= 0.9) ap++; else if (ra < 0.7) below++; });
      const critical = cur.rows.filter(r => (r.total || 0) / T >= 0.7 && (r.total || 0) / T < 0.8).slice(0, 5).map(r => r.name);
      out.study = `根据最近一次「${cur.name}」（${cur.date}，满分 ${T} 分）的学情数据：班级平均分 ${avg} 分，A+ 等级（≥90%）${ap} 人，B+ 以下 ${below} 人；` +
        (critical.length ? `临界生（70%-80%）主要有 ${critical.join('、')}，需要在后续教学中重点帮扶。` : `整体分布较为均衡。`);
    } else out.study = '';
  }
  // 德育管理
  if (!($('#dwLk_moral') && !$('#dwLk_moral').checked)){
    if (DB.moral.length){
      const m = {}; DB.moral.forEach(x => m[x.student] = (m[x.student] || 0) + x.score);
      const rank = Object.entries(m).sort((a, b) => b[1] - a[1]);
      const minus = DB.moral.filter(x => x.score < 0).length;
      out.moral = `本学期累计记录德育加减分 ${DB.moral.length} 条，其中减分记录 ${minus} 条；德育积分名列前茅的有 ${rank.slice(0, 3).map(r => r[0]).join('、')}；` +
        (rank.length && rank[rank.length - 1][1] < 0 ? `个别同学积分为负，需加强行为习惯引导。` : `班级德育整体态势良好。`);
    } else out.moral = '';
  }
  // 谈心谈话
  if (!($('#dwLk_talks') && !$('#dwLk_talks').checked)){
    if (DB.talks.length){
      const pend = DB.talks.filter(t => !t.done && t.followDate).length;
      const last = DB.talks[DB.talks.length - 1];
      out.talks = `本学期共开展谈心谈话 ${DB.talks.length} 次，覆盖类型包括日常谈心、成绩分析、心理辅导与纪律谈话；目前有待跟进事项 ${pend} 项；最近一次谈话对象为 ${last.student}（${last.type}），后续将按计划跟进反馈。`;
    } else out.talks = '';
  }
  // 家校沟通
  if (!($('#dwLk_family') && !$('#dwLk_family').checked)){
    if (DB.family.length){
      const month = todayStr().slice(0, 7);
      const mth = DB.family.filter(f => (f.date || '').startsWith(month)).length;
      out.family = `本学期累计家校沟通 ${DB.family.length} 次，本月 ${mth} 次，沟通方式涵盖电话、微信、面谈与家访；对重点关注学生均建立了常态化联系机制，家长配合度较高。`;
    } else out.family = '';
  }
  return out;
}

/* ---------- 生成初稿（已配置 AI → 真实生成；未配置 → 模板化 + 联动数据填充） ---------- */
async function genDocDraft(){
  const d = DOC_FLAT[DB.docsDraft.type]; if (!d) return;
  const title = DB.docsDraft.title || d.name;
  const keys = (DB.docsDraft.keys || '').split(/[,，、\s]+/).filter(Boolean);
  if (!keys.length) return toast('请先输入 3-5 个关键词', 'warn');
  if (aiConfigured()) return genDocDraftAI(d, title, keys);
  genDocDraftLocal(d, title, keys);
}
async function genDocDraftAI(d, title, keys){
  const target = +($('#dwWords') ? $('#dwWords').value : 2000);
  const lk = docLinkedSummaries();
  const linked = Object.entries(lk).filter(x => x[1]).map(x => ({ study: '学情分析数据', moral: '德育管理数据', talks: '谈心谈话数据', family: '家校沟通数据' }[x[0]] + '：' + x[1])).join('\n');
  const btns = $$('#dwGenBtn') || [];
  const ta = $('#dwText');
  ta.value = ''; DB.docsDraft.text = ''; DB.docsDraft.title = title; dbSave();
  toast('🤖 AI 正在按大纲撰写初稿（流式输出，可直接观察进度）…');
  try{
    const full = await aiChat([
      { role: 'system', content: `你是一位资深的中学教师兼公文写作专家，正在撰写一篇${d.cat}的「${d.name}」。要求：内容贴合一线教育教学实际、具体可落地、避免空话套话；严格按给定大纲逐节撰写；语言规范书面化。` },
      { role: 'user', content: `请撰写《${title}》。\n\n文档类型：${d.cat} · ${d.name}\n关键词：${keys.join('、')}\n目标字数：约 ${target} 字（${target - 200}~${target + 300} 之间）\n大纲（必须严格按此结构，二级标题用「一、二、三…」编号）：\n${d.outline.map(o => '- ' + o.replace(/^[一二三四五六七八九十]+、/, '')).join('\n')}\n${linked ? '\n以下是工作台中的真实班级数据，请自然融入相应章节（不要出现“数据显示”这类机械表述，有数据的章节要具体引用数字与学生情况）：\n' + linked : ''}\n\n输出格式（Markdown）：第一行为「# ${title}」，每个大纲节为「## 节名」。直接输出正文，不要任何额外说明。` }
    ], { temperature: 1.2, maxTokens: 8192, onDelta: (delta, full) => {
      ta.value = full; DB.docsDraft.text = full;
      ta.scrollTop = ta.scrollHeight;
      const c = $('#dwCount'); if (c) c.textContent = '🤖 AI 生成中…当前字数：' + full.replace(/\s/g, '').length + ' 字';
    } });
    DB.docsDraft.text = full; dbSave();
    ta.value = full; updateDocCount();
    toast('AI 初稿已生成（' + full.replace(/\s/g, '').length + ' 字），可继续编辑修改');
  }catch(e){
    toast('AI 生成失败：' + e.message + '，可重试或清空 AI 配置使用模板生成', 'err');
    if (!DB.docsDraft.text) genDocDraftLocal(DOC_FLAT[DB.docsDraft.type], title, keys);
    updateDocCount();
  }
}
function genDocDraftLocal(d, title, keys){
  const target = +($('#dwWords') ? $('#dwWords').value : 2000);
  const lk = docLinkedSummaries();
  const keyStr = keys.join('、');
  const secTexts = {
    '学情分析': lk.study, '学业情况分析': lk.study, '学业表现概述': lk.study, '学业水平': lk.study,
    '德育与常规管理措施': lk.moral, '班级概况': lk.moral, '思想品德': lk.moral, '品德与同伴关系': lk.moral,
    '典型案例回顾': lk.talks, '育人成效': lk.talks, '带班实绩': (lk.talks || '') + (lk.moral || ''),
    '家校协同计划': lk.family, '家校配合建议': lk.family, '家校社协同成果': lk.family, '社会实践': lk.family
  };
  const filler = [
    `本学期将围绕${keyStr}开展工作，坚持以学生发展为本，注重过程性评价与结果性评价相结合，让每一位学生在原有基础上获得成长。`,
    `在具体实施中，坚持“目标—实施—反馈—改进”的闭环管理，定期复盘${keyStr}相关工作的推进情况，及时调整策略。`,
    `同时充分发挥学生的主体作用，通过小组合作、同伴互助等方式，激发学生内驱力，营造积极向上的班级氛围。`,
    `在落实过程中，注意分层推进、因材施教，针对不同层次学生的特点设计差异化任务，确保${keyStr}各项举措落到实处。`,
    `定期通过课堂观察、作业分析、学生访谈等方式收集反馈，形成动态调整机制，保证工作有序高效推进。`,
    `注重榜样引领与正向激励，通过展示优秀成果、及时表扬进步，让学生的努力被看见、被肯定。`,
    `加强团队协作，与科任教师保持密切沟通，形成教育合力，共同关注学生的全面发展。`
  ];
  let fi = 0;
  const nextFiller = () => filler[(fi++) % filler.length];

  const parts = [`# ${title}`, ``];
  d.outline.forEach(sec => {
    parts.push(`## ${sec}`);
    if (secTexts[sec]) { parts.push(secTexts[sec]); parts.push(''); }
    const body = nextFiller();
    parts.push(`${body}围绕“${sec.replace(/^[一二三四五六七八九十]+、/, '')}”这一部分，结合${keyStr}的要求，进一步细化落实路径：首先明确责任分工与时间节点；其次建立跟踪记录机制；最后以阶段性成果检验实际成效。`);
    parts.push('');
  });
  parts.push(`（本文档由教师工作台基于关键词「${keyStr}」与工作台联动数据生成初稿，请根据实际情况修改完善。）`);
  let text = parts.join('\n');
  // 不足目标字数时补充通用段落
  let guard = 0;
  while (text.replace(/\s/g, '').length < target && guard++ < 30){
    text += `\n此外，${nextFiller()}下阶段将继续以${keyStr}为抓手，稳扎稳打，推动各项工作再上新台阶。\n`;
  }
  DB.docsDraft.text = text; DB.docsDraft.title = title; dbSave();
  $('#dwText').value = text; updateDocCount();
  toast('初稿已生成（' + text.replace(/\s/g, '').length + ' 字），可继续编辑');
}

function docTextToHTML(text, title){
  const lines = (text || '').split('\n');
  let html = `<h1>${esc(title || (DB.docsDraft.title || '未命名文档'))}</h1>`;
  let buf = [];
  lines.forEach(l => {
    const t = l.trim();
    if (!t){ if (buf.length){ html += `<p>${esc(buf.join(''))}</p>`; buf = []; } return; }
    if (/^#\s+/.test(t)){ if (buf.length){ html += `<p>${esc(buf.join(''))}</p>`; buf = []; } html += `<h1>${esc(t.replace(/^#\s+/, ''))}</h1>`; }
    else if (/^##\s+/.test(t) || /^[一二三四五六七八九十]+、/.test(t)){ if (buf.length){ html += `<p>${esc(buf.join(''))}</p>`; buf = []; } html += `<h2>${esc(t.replace(/^##\s+/, ''))}</h2>`; }
    else buf.push(t);
  });
  if (buf.length) html += `<p>${esc(buf.join(''))}</p>`;
  return html;
}

    confirmBox(`确认导入备份？<br><b style="color:#C0392B">当前数据将被覆盖！</b><br>

function oneClickFix(){

    <ol style="font-size:13px;line-height:2;padding-left:20px">

    </ol>
    <div class="hint" style="color:#C0392B;margin-top:10px">修复前会自动创建一份当前数据的快照作为安全回滚点。</div>

      <button class="btn danger" onclick="doOneClickFix()">确认修复</button></div>`);
}
function doOneClickFix(){
  // 先存快照
  saveSnapshot('修复前自动保存');
  let fixes = 0;
  // 1. 补齐缺失字段
  for (const k in DB_DEFAULT) if (DB[k] === undefined) { DB[k] = JSON.parse(JSON.stringify(DB_DEFAULT[k])); fixes++; }
  // 2. 清理空学生
  const beforeStu = DB.students.length;
  DB.students = DB.students.filter(s => s && s['姓名']);
  fixes += beforeStu - DB.students.length;
  // 3. 清理空待办
  const beforeTodo = DB.todos.length;
  DB.todos = DB.todos.filter(t => t && t.title);
  fixes += beforeTodo - DB.todos.length;
  // 4. 清理空谈话
  const beforeTalk = DB.talks.length;
  DB.talks = DB.talks.filter(t => t && t.student && t.content);
  fixes += beforeTalk - DB.talks.length;
  // 5. 清理空德育
  const beforeMoral = DB.moral.length;
  DB.moral = DB.moral.filter(m => m && m.student && m.reason);
  fixes += beforeMoral - DB.moral.length;
  // 6. 清理空家校
  const beforeFam = DB.family.length;
  DB.family = DB.family.filter(f => f && f.student && f.content);
  fixes += beforeFam - DB.family.length;
  dbSave(); closeModal();
  toast(`✅ 修复完成，共处理 ${fixes} 项问题（已自动保存修复前快照）`);
}

/* ---- 清理重复学生 ---- */
function cleanDuplicateStudents(){
  const map = {};
  const dups = [];
  DB.students.forEach((s, i) => {
    const key = (s['学号'] || '') + '|' + (s['姓名'] || '');
    if (!key) return;
    if (map[key] !== undefined){ dups.push({ keep: map[key], remove: i, name: s['姓名'] || '', id: s['学号'] || '' }); }
    else map[key] = i;
  });
  if (!dups.length) return toast('未发现重复学生 ✅', 'mint');
  openModal('清理重复学生', `<p>发现 <b style="color:#C0392B">${dups.length}</b> 组重复记录：</p>
    <table class="tb" style="margin:10px 0"><tr><th>学号</th><th>姓名</th><th>操作</th></tr>
    ${dups.map(d => `<tr><td>${esc(d.id)}</td><td><b>${esc(d.name)}</b></td><td><span class="hint">保留第${d.keep+1}条，删除第${d.remove+1}条</span></td></tr>`).join('')}</table>
    <div class="hint">合并规则：保留信息更完整（字段非空更多）的那一条。</div>
    <div style="text-align:right;margin-top:12px"><button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn danger" onclick="doCleanDuplicates()">确认清理</button></div>`);
  window._dupList = dups;
}
function doCleanDuplicates(){
  const dups = window._dupList || [];
  // 按索引从大到小排序删除（避免偏移）
  dups.sort((a, b) => b.remove - a.remove);
  let removed = 0;
  dups.forEach(d => {
    const keep = DB.students[d.keep], rem = DB.students[d.remove];
    if (!keep || !rem) return;
    // 合并：keep 缺失的字段从 rem 补充
    Object.keys(rem).forEach(k => { if (!keep[k] && rem[k]) keep[k] = rem[k]; });
    DB.students.splice(d.remove, 1); removed++;
  });
  dbSave(); closeModal(); go('#/class/students');
  toast(`已清理 ${removed} 条重复学生记录`);
}

/* ---- 快照管理 ---- */
function getBackups(){ try{ return JSON.parse(localStorage.getItem(BACKUP_KEY)) || []; } catch(e){ return []; } }
function saveSnapshot(note){
  const list = getBackups();
  const text = JSON.stringify(DB);
  list.unshift({ date: new Date().toLocaleString('zh-CN') + (note ? ' (' + note + ')' : ''), size: text.length, data: text });
  if (list.length > BACKUP_MAX) list.splice(BACKUP_MAX);
  try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(list)); }catch(e){}
}
function restoreSnapshot(i){
  const list = getBackups(); if (!list[i]) return;
  confirmBox(`确认恢复到 <b>${list[i].date}</b> 的快照？<br><b style="color:#C0392B">当前数据将被覆盖！</b>`, () => {
    try{ const data = JSON.parse(list[i].data); Object.assign(DB, data); dbSave(); toast('✅ 已恢复快照，页面将刷新…'); setTimeout(() => location.reload(), 1000); }
    catch(e){ toast('恢复失败：' + e.message, 'err'); }
  });
}
function delSnapshot(i){ confirmBox('确认删除该快照？', () => {
  const list = getBackups(); list.splice(i, 1); localStorage.setItem(BACKUP_KEY, JSON.stringify(list)); go('#/docs/data'); }); }

  DB.settings.backupAuto = on; dbSave();
  const chk = $('#backupAutoChk'); if (chk) chk.nextElementSibling.textContent = on ? '已开启' : '已关闭';
  if (on){ window.addEventListener('beforeunload', autoBackupHandler); window.addEventListener('unload', autoBackupHandler); }
  else { window.removeEventListener('beforeunload', autoBackupHandler); window.removeEventListener('unload', autoBackupHandler); }
  toast(on ? '✅ 自动快照已开启（关闭/刷新页面时自动保存）' : '已关闭自动快照');
}
function autoBackupHandler(){ saveSnapshot('窗口关闭自动保存'); }

/* ---- 设置保存 ---- */
function saveBackupSettings(){
  const v = parseInt($('#backRemindDays').value);
  DB.settings.backupRemindDays = isNaN(v) ? 7 : Math.max(0, Math.min(90, v)); dbSave();
  toast('提醒设置已保存（每 ' + DB.settings.backupRemindDays + ' 天提醒一次，0=关闭）');
}

/* ---- 数据总览 ---- */
function renderDataOverview(){
  const el = $('#dataOverview'); if (!el) return;
  const dbSize = new Blob([JSON.stringify(DB)]).size;
  el.innerHTML = `
    <div class="stat-card"><div class="num">${DB.students.length}</div><div class="lab">👥 学生数</div></div>
    <div class="stat-card mint"><div class="num">${DB.todos.length}</div><div class="lab">📋 待办数</div></div>
    <div class="stat-card lav"><div class="num">${(DB.agencyFee.projects||[]).length}</div><div class="lab">💰 收费项目</div></div>
    <div class="stat-card butter"><div class="num" style="font-size:13px">${dbSize > 1024 ? (dbSize/1024).toFixed(1)+'KB' : dbSize+'B'}</div><div class="lab">💾 数据大小</div></div>`;
}

// 初始化自动备份监听
(function initAutoBackup(){
  if (DB.settings.backupAuto !== false){
    window.addEventListener('beforeunload', autoBackupHandler);
    window.addEventListener('unload', autoBackupHandler);
  }
})();

</script>
<script>
/* ================= 每日工作流：聚合各板块待办与提醒（已剔除参赛助手相关来源） ================= */

const WF_DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
const WF_PERIODS = ['第1节','第2节','第3节','第4节','第5节','第6节','第7节','第8节','第9节','第10节','第11节'];

regRoute('#/workflow', v => {
  v.innerHTML = `
  <div class="grid g4" style="margin-bottom:18px" id="wfStats"></div>
  <div class="grid g2" style="align-items:start">
    <div class="card"><div class="card-title"><h3>✅ 今日待办清单</h3>
      <span class="sub">排序：具体时间 → 今日必做 → 已逾期</span></div>
      <div class="hint" style="margin-bottom:10px">勾选完成即回写对应板块状态（待办 / 谈心跟进），并从清单移除。</div>
      <div id="wfList"></div></div>
    <div>
      <div class="card"><div class="card-title"><h3>⏰ 定时提醒</h3><span class="sub">今日课表 · 值日 · 班会</span></div>
        <div id="wfRemind"></div></div>
      <div class="card"><div class="card-title"><h3>⚡ 快捷操作八宫格</h3></div>
        <div class="grid g4" id="wfQuick"></div></div>
    </div>
  </div>`;
  renderWorkflow();
});

function renderWorkflow(){
  renderWfStats(); renderWfList(); renderWfRemind(); renderWfQuick();
}

/* ---------- 待办聚合 ---------- */
function wfCollect(){
  const today = todayStr();
  const items = []; // {time:'', level:2已逾期/1今日必做/0具体时间, tag, title, desc, link, kind, ref}
  // 1. To Do List（未完成 / 逾期）
  DB.todos.forEach((t, i) => {
    if (t.done) return;
    if (!t.date || t.date > today) return;
    const over = t.date < today;
    items.push({ time: over ? '已逾期' : '今日', level: over ? 2 : 1, tag: t.tag || '待办', cls: 'pink',
      title: t.title, desc: (over ? `截止 ${t.date}，已逾期 ${-daysUntil(t.date)} 天，请尽快处理` : `截止今日，分类：${t.tag || '待办'}`),
      link: '#/home', kind: 'todo', ref: i });
  });
  // 2. 谈心跟进（followDate=今日且未完成）
  DB.talks.forEach((x, i) => {
    if (x.done || !x.followDate) return;
    if (x.followDate === today) items.push({ time: '今日', level: 1, tag: '谈心跟进', cls: 'lav',
      title: `跟进：${x.student}（${x.type}）`, desc: `跟进事项：${x.followItem || '—'}（来源：谈话谈心）`,
      link: '#/class/talks', kind: 'talk', ref: i });
    else if (x.followDate < today) items.push({ time: '已逾期', level: 2, tag: '谈心跟进', cls: 'lav',
      title: `逾期未跟进：${x.student}`, desc: `原定 ${x.followDate} 跟进：${x.followItem || '—'}`, link: '#/class/talks', kind: 'talk', ref: i });
  });
  // 3. 今日生日
  DB.students.filter(s => s.birth && s.birth.slice(5) === today.slice(5)).forEach(s => {
    items.push({ time: '今日', level: 1, tag: '生日祝福', cls: 'butter',
      title: `🎂 今天是 ${s.name} 的生日`, desc: '可在晨会/课间送上祝福，家校沟通中也可向家长致意', link: '#/class/students', kind: 'remind' });
  });
  // 4. 今日德育「作业」类减分提醒
  const hwMinus = DB.moral.filter(x => x.date === today && x.category === '作业' && x.score < 0);
  if (hwMinus.length) items.push({ time: '今日', level: 1, tag: '德育提醒', cls: 'mint',
    title: `今日作业类减分 ${hwMinus.length} 条`, desc: `涉及：${[...new Set(hwMinus.map(x => x.student))].join('、')}，建议课后提醒并跟进补交`,
    link: '#/class/moral', kind: 'remind' });
  // 5. 出卷计划（待办中含“出卷”）
  DB.todos.forEach((t, i) => {
    if (t.done || !/出卷|组卷|试卷/.test(t.title + (t.tag || ''))) return;
    if (!t.date || t.date > today) return;
    items.push({ time: t.date < today ? '已逾期' : '今日', level: t.date < today ? 2 : 1, tag: '出卷计划', cls: 'lav',
      title: `📚 ${t.title}`, desc: '可跳转「智能组卷」完成组卷与导出', link: '#/teach/paper', kind: 'remind' });
  });
  // 6. 学科成绩临界生（最近一次考试）
  if (DB.subjectExams.length){
    const cur = DB.subjectExams[DB.subjectExams.length - 1];
    const T = cur.totalScore || (cur.maxPer || []).reduce((a, b) => a + b, 0) || 100;
    const cri = cur.rows.filter(r => (r.total || 0) / T >= 0.7 && (r.total || 0) / T < 0.8).slice(0, 5);
    if (cri.length) items.push({ time: '关注', level: 1, tag: '临界生', cls: 'mint',
      title: `重点关注 ${cri.length} 名临界生`, desc: `${cri.map(r => r.name).join('、')}（${cur.name}，处于 70%-80% 区间），建议安排个性化辅导`,
      link: '#/analysis/subject', kind: 'remind' });
  }
  // 7. 临近考试（7 天内）
  DB.exams.filter(e => { const d = daysUntil(e.date); return d >= 0 && d <= 7; }).forEach(e => {
    items.push({ time: `${daysUntil(e.date)} 天后`, level: 0, tag: '考试提醒', cls: 'butter',
      title: `📝 ${e.name}`, desc: `考试日期 ${e.date}，请做好复习安排与考前动员`, link: '#/home', kind: 'remind' });
  });
  // 8. 今日课程（具体时间，来自教师课表）
  const dayIdx = (new Date().getDay() + 6) % 7; // 0=周一
  const wk = typeof currentWeekNo === 'function' ? currentWeekNo() : 1;
  const tw = DB.timetable.teacher.weeks[wk] || {};
  const times = DB.timetable.times[DB.timetable.season] || null;
  for (let r = 0; r < WF_PERIODS.length; r++){
    const v = tw['r' + r + 'c' + dayIdx];
    if (v) items.push({ time: times ? times[r] : WF_PERIODS[r], level: 0, tag: '今日课程', cls: 'pink',
      title: `${v}（${WF_PERIODS[r]}）`, desc: '来源：教师课表 · 本周', link: '#/home', kind: 'remind' });
  }
  // 排序：具体时间 → 今日必做 → 已逾期（同级按时间）
  const lvOrder = l => l === 2 ? 2 : l === 1 ? 1 : 0;
  items.sort((a, b) => (b.level - a.level) || String(a.time).localeCompare(String(b.time)));
  return items;
}

function renderWfStats(){
  const items = wfCollect();
  const remindN = items.filter(x => x.kind === 'remind' || x.tag === '考试提醒' || x.tag === '今日课程').length;
  const focusN = items.filter(x => x.level === 2 || x.tag === '临界生').length;
  const undone = DB.todos.filter(t => !t.done).length;
  $('#wfStats').innerHTML = `
    <div class="stat-card"><div class="num">${undone}</div><div class="lab">📋 今日待办（未完成）</div></div>
    <div class="stat-card mint"><div class="num">${remindN}</div><div class="lab">⏰ 今日提醒</div></div>
    <div class="stat-card lav"><div class="num">${focusN}</div><div class="lab">⚠️ 重点关注（逾期/临界生）</div></div>
    <div class="stat-card butter"><div class="num" style="font-size:15px;line-height:26px"><a href="#/home" style="color:inherit;text-decoration:none">进入首页 →</a></div><div class="lab">⚡ 快捷操作</div></div>`;
}

function renderWfList(){
  const items = wfCollect();
  const el = $('#wfList'); if (!el) return;
  if (!items.length) return el.innerHTML = `<div class="empty">🎉 今日暂无待办与提醒， Enjoy your day！</div>`;
  el.innerHTML = items.map(x => `
    <div class="wf-todo ${x.level === 2 ? 'overdue' : ''}">
      <span class="time">${esc(x.time)}</span>
      <div class="body"><b>${esc(x.title)} <span class="tag ${x.cls}">${esc(x.tag)}</span></b><p>${esc(x.desc)}</p></div>
      ${x.kind === 'todo' ? `<input type="checkbox" title="完成待办" onchange="wfDone('todo',${x.ref})">` : ''}
      ${x.kind === 'talk' ? `<input type="checkbox" title="完成跟进" onchange="wfDone('talk',${x.ref})">` : ''}
      <button class="btn sm ghost" onclick="location.hash='${x.link}'">前往 ›</button>
    </div>`).join('');
}

function wfDone(kind, i){
  if (kind === 'todo'){ DB.todos[i].done = true; toast('待办已完成，已回写首页 To Do List'); }
  else if (kind === 'talk'){ DB.talks[i].done = true; toast('跟进已完成，已回写谈话谈心记录'); }
  dbSave(); renderWorkflow();
}

/* ---------- 定时提醒：值日 / 班会 / 课表 ---------- */
function renderWfRemind(){
  const el = $('#wfRemind'); if (!el) return;
  const out = [];
  // 值日：本周值日生
  const wkMap = DB.duty.weeks;
  if (Object.keys(wkMap).length){
    const curW = ((currentWeekNo() - 1) % 8) + 1;
    const posts = typeof DUTY_POSTS !== 'undefined' ? DUTY_POSTS : ['讲台','黑板','地面','图书角','窗台','垃圾'];
    out.push(`<div class="news-item"><b>🧹 本周（第${curW}轮）值日安排</b><p>${posts.map((p, i) => `${p}：${esc(wkMap[curW] ? wkMap[curW][i] || '—' : '—')}`).join('；')}</p><span class="src">劳动委员：${esc(DB.duty.commissioner || '未设置')}</span></div>`);
  } else out.push(`<div class="news-item"><b>🧹 值日提醒</b><p>尚未生成值日表，可前往「班级管理 → 值日安排」一键生成。</p></div>`);
  // 班会：默认周五提醒
  const dayIdx = (new Date().getDay() + 6) % 7;
  const classTT = DB.timetable.class.weeks[currentWeekNo()] || {};
  let hasMeeting = false;
  for (let r = 0; r < WF_PERIODS.length; r++){
    const v = classTT['r' + r + 'c' + dayIdx];
    if (v && /班会/.test(v)) hasMeeting = true;
  }
  out.push(`<div class="news-item"><b>📢 班会提醒</b><p>${dayIdx === 4 ? '今天是周五，请提前准备班会课内容。' : hasMeeting ? '今日课表含班会课，请提前准备素材。' : '本周班会安排在周五（可在课表中标注“班会”以获得当日提醒）。'}</p></div>`);
  // 今日课程数量
  const tw = DB.timetable.teacher.weeks[currentWeekNo()] || {};
  let cnt = 0;
  for (let r = 0; r < WF_PERIODS.length; r++) if (tw['r' + r + 'c' + dayIdx]) cnt++;
  out.push(`<div class="news-item"><b>📚 今日课程</b><p>教师课表今日共 ${cnt} 节课${cnt ? '，注意合理安排备课与批改时间。' : '（今日无课或未录入课表）。'}</p></div>`);
  el.innerHTML = out.join('');
}

/* ---------- 八宫格快捷入口 ---------- */
const WF_QUICK = [
  { icon: '📝', name: '出卷', sub: '智能组卷', act: "location.hash='#/teach/paper'" },
  { icon: '💬', name: '谈心谈话', sub: '记录+跟进', act: "location.hash='#/class/talks'" },
  { icon: '🪑', name: '排座位', sub: '自动排座', act: "location.hash='#/class/seats'" },
  { icon: '📊', name: '成绩分析', sub: '学情诊断', act: "location.hash='#/analysis/subject'" },
  { icon: '⭐', name: '德育积分', sub: '加减分记录', act: "location.hash='#/class/moral'" },
  { icon: '📅', name: '查课表', sub: '本周课表', act: "location.hash='#/home'" },
  { icon: '➕', name: '新增待办', sub: '添加 To Do', act: 'wfAddTodo()' },
  { icon: '🗂️', name: '全部功能', sub: '导航目录', act: "location.hash='#/home'" }
];
function renderWfQuick(){
  const el = $('#wfQuick'); if (!el) return;
  el.innerHTML = WF_QUICK.map(q => `
    <div class="site-card" onclick="${q.act}">
      <span class="ic">${q.icon}</span><b>${q.name}</b><span>${q.sub}</span>
    </div>`).join('');
}
function wfAddTodo(){
  openModal('新增待办', `
    <div class="field"><label class="fl">标题</label><input type="text" id="wtdTitle" placeholder="待办事项标题"></div>
    <div class="grid g2"><div class="field"><label class="fl">截止日期</label><input type="date" id="wtdDate" value="${todayStr()}"></div>
    <div class="field"><label class="fl">分类标签</label><select id="wtdTag"><option>备课</option><option>批改</option><option>班级管理</option><option>个人事务</option></select></div></div>
    <div style="text-align:right"><button class="btn" onclick="wfSaveTodo()">保存</button></div>`);
  setTimeout(() => $('#wtdTitle').focus(), 60);
}
function wfSaveTodo(){
  const t = { title: $('#wtdTitle').value.trim(), date: $('#wtdDate').value, tag: $('#wtdTag').value };
  if (!t.title) return toast('请填写标题', 'warn');
  DB.todos.push({ ...t, done: false }); dbSave(); closeModal(); renderWorkflow(); toast('待办已添加并同步到首页 To Do List');
}

</script>
<script>
/* ================= 启动引导 ================= */
function isMobile(){ return window.innerWidth <= 768; }
function closeMobileNav(){
  if (window.innerWidth > 768) return;
  const sb = $('#sidebar'), mask = $('#navMask');
  if (sb) sb.classList.add('collapsed');
  if (mask) mask.classList.remove('show');
}
document.addEventListener('DOMContentLoaded', () => {
  // 1. 加载数据库
  loadDB();
  applySavedPalette();
  DB.docsDraft = DB.docsDraft || { type: '', title: '', text: '', keys: '' };
  renderAIStatus();

  // 2. 顶栏日期
  const d = new Date();
  $('#topDate').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · 星期${weekOfDay()}`;

  // 3. 构建导航 + 首次路由
  buildNav();
  if (!location.hash) location.hash = '#/home';
  router();

  // 4. 路由监听
  window.addEventListener('hashchange', router);

  // 5. 导航折叠 / 手机抽屉
  const navToggle = $('#navToggle');
  if (navToggle) navToggle.onclick = () => {
    const sb = $('#sidebar');
    sb.classList.toggle('collapsed');
    if (isMobile()){
      const mask = $('#navMask');
      if (mask) mask.classList.toggle('show', !sb.classList.contains('collapsed'));
    }
  };
  const mask = $('#navMask');
  if (mask) mask.addEventListener('click', closeMobileNav);
  // 手机端默认收起侧边栏
  if (isMobile()) $('#sidebar').classList.add('collapsed');
  // 尺寸变化回到桌面时清掉遮罩
  window.addEventListener('resize', () => { if (!isMobile()){ const m = $('#navMask'); if (m) m.classList.remove('show'); } });
});

</script>
