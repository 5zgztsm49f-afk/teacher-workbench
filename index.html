<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEACHER WORKSPACE v2.0 · 智能化教学管理平台</title>
<style>
/* ============ TEACHER WORKSPACE v2.0 · 奶油马卡龙主题 ============ */
:root{
  --cream:#FFF9F2; --card:#FFFFFF;
  --pink:#F9D5E0; --pink-deep:#EC9BB7; --mint:#D7EEE4; --mint-deep:#7FBFA5;
  --lav:#E8E1F4; --lav-deep:#A393D6; --butter:#FBEFD3; --butter-deep:#E0B95E;
  --ink:#4A3F55; --ink-2:#7A6E8A; --line:#F0E4EA;
  --ok:#5BAD8B; --warn:#E8A13C; --danger:#E36D6D;
  --shadow:0 4px 18px rgba(160,120,150,.10);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;background:var(--cream);color:var(--ink);font-size:14px}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ---------- 顶栏 ---------- */
.topbar{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  background:linear-gradient(90deg,var(--pink) 0%,var(--lav) 50%,var(--mint) 100%);box-shadow:var(--shadow);z-index:20}
.topbar-left{display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand-name{font-weight:700;letter-spacing:1px;font-size:16px;color:#fff;text-shadow:0 1px 4px rgba(120,80,110,.25)}
.brand-ver{font-size:11px;color:#fff;opacity:.9}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-date{font-size:13px;color:#fff;background:rgba(255,255,255,.35);padding:4px 12px;border-radius:20px}
.theme-dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff}
.theme-dot.pink{background:var(--pink-deep)}.theme-dot.mint{background:var(--mint-deep)}
.theme-dot.lav{background:var(--lav-deep)}.theme-dot.butter{background:var(--butter-deep)}
.icon-btn{border:none;background:rgba(255,255,255,.4);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:16px;color:#fff}
.icon-btn:hover{background:rgba(255,255,255,.6)}

/* ---------- 布局 ---------- */
.layout{flex:1;display:flex;min-height:0}
.sidebar{width:248px;flex:none;background:#FDF3F7;border-right:1px solid var(--line);overflow-y:auto;transition:margin .25s;display:flex;flex-direction:column}
.sidebar.collapsed{margin-left:-248px}
.sidebar-foot{padding:12px;text-align:center;font-size:11px;color:#C9A9BC;flex:none}
.main{flex:1;overflow-y:auto;padding:20px 24px 60px}
#view{max-width:1280px;margin:0 auto}

/* ---------- 导航树 ---------- */
.nav-group>.nav-label{display:flex;align-items:center;gap:8px;padding:11px 16px;font-weight:600;cursor:pointer;color:var(--ink);border-radius:10px;margin:2px 8px;user-select:none}
.nav-group>.nav-label:hover{background:#F9E4EE}
.nav-group>.nav-label .arrow{margin-left:auto;font-size:10px;color:#C9A9BC;transition:transform .2s}
.nav-group.open>.nav-label .arrow{transform:rotate(90deg)}
.nav-children{display:none}
.nav-group.open>.nav-children{display:block}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 14px 9px 34px;margin:1px 8px;cursor:pointer;color:var(--ink-2);border-radius:10px;font-size:13.5px;text-decoration:none}
.nav-item:hover{background:#F9E4EE;color:var(--ink)}
.nav-item.active{background:linear-gradient(90deg,var(--pink),#FCE3EC);color:#B25A80;font-weight:600;box-shadow:inset 0 0 0 1px #F3C6D8}
.nav-item .arrow{margin-left:auto;font-size:10px;color:#C9A9BC}
.nav-children .nav-children .nav-item{padding-left:48px;font-size:13px}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px;border:1px solid #FBEEF4}
.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title h3{font-size:15.5px;display:flex;align-items:center;gap:8px}
.card-title .sub{font-size:12px;color:var(--ink-2);font-weight:400}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.sidebar{position:fixed;z-index:30;height:100%}}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:10px;padding:8px 16px;cursor:pointer;font-size:13px;font-family:inherit;transition:.15s;background:var(--pink);color:#8C3D60;font-weight:600}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.mint{background:var(--mint);color:#3D7A62}.btn.lav{background:var(--lav);color:#574790}
.btn.butter{background:var(--butter);color:#8A6A1F}.btn.ghost{background:#F6EEF3;color:var(--ink-2);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.danger{background:#FBDADA;color:#B33A3A}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;font-family:inherit;background:#FFFEFB;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pink-deep)}
textarea{resize:vertical;min-height:70px;line-height:1.6}
label.fl{font-size:12.5px;color:var(--ink-2);display:block;margin-bottom:4px;font-weight:600}
.field{margin-bottom:12px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11.5px;font-weight:600}
.tag.pink{background:var(--pink);color:#B25A80}.tag.mint{background:var(--mint);color:#3D7A62}
.tag.lav{background:var(--lav);color:#574790}.tag.butter{background:var(--butter);color:#8A6A1F}
.tag.gray{background:#F0ECF2;color:#8A8294}
.table-wrap{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.tb th{background:#FBF1F6;color:#8A6E80;font-weight:600;padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:2px solid var(--line)}
table.tb td{padding:7px 10px;border-bottom:1px solid #F7EEF3;vertical-align:middle}
table.tb tr:hover td{background:#FDF7FA}
.empty{padding:36px;text-align:center;color:#C4B4C6;font-size:13px}
.hint{font-size:12px;color:#A795B5;line-height:1.7}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.stat-card{background:linear-gradient(135deg,#FFF,#FDF3F8);border:1px solid #F6E6EE;border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.stat-card .num{font-size:26px;font-weight:800;color:#B25A80}
.stat-card .lab{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.stat-card.mint .num{color:#3D7A62}.stat-card.lav .num{color:#574790}.stat-card.butter .num{color:#8A6A1F}
.stat-card.mint{background:linear-gradient(135deg,#FFF,#F0F9F4);border-color:#E2F2EA}
.stat-card.lav{background:linear-gradient(135deg,#FFF,#F5F1FB);border-color:#E9E2F6}
.stat-card.butter{background:linear-gradient(135deg,#FFF,#FEF8E8);border-color:#F5EBCF}
.badge-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.bar-wrap{background:#F4E9EF;border-radius:8px;height:10px;overflow:hidden}
.bar-wrap>i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--pink-deep),var(--lav-deep))}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs .tab{padding:7px 16px;border-radius:20px;cursor:pointer;background:#F7EEF3;color:var(--ink-2);font-size:13px;font-weight:600;border:none;font-family:inherit}
.tabs .tab.on{background:linear-gradient(90deg,var(--pink),#FBD9E6);color:#8C3D60;box-shadow:var(--shadow)}
.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:13px;user-select:none}
.switch{position:relative;width:42px;height:22px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:#E4D6DF;border-radius:20px;transition:.2s;cursor:pointer}
.switch i:before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--mint-deep)}
.switch input:checked+i:before{left:23px}
.kv{display:flex;gap:8px;font-size:13px;padding:4px 0}
.kv b{color:var(--ink-2);font-weight:600;flex:none}

/* ---------- 弹窗 / 提示 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(74,63,85,.35);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(90,50,80,.25);width:min(680px,92vw);max-height:86vh;display:flex;flex-direction:column;animation:pop .18s}
.modal.wide{width:min(960px,94vw)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.modal-close{border:none;background:#F7EEF3;width:28px;height:28px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.modal-body{padding:18px 20px;overflow-y:auto}
#toastWrap{position:fixed;top:70px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border-left:4px solid var(--mint-deep);border-radius:10px;box-shadow:var(--shadow);padding:11px 16px;font-size:13px;animation:pop .2s;max-width:320px}
.toast.warn{border-color:var(--warn)}.toast.err{border-color:var(--danger)}

/* ---------- 首页 ---------- */
.palette-wrap{position:relative;min-height:190px}
.palette{position:absolute;width:150px;height:150px;border-radius:50%;cursor:grab;user-select:none;z-index:5;
  background:conic-gradient(#F48FB1 0 25%,#A5D6C9 0 50%,#B39DDB 0 75%,#F6D98A 0 100%);
  box-shadow:0 6px 20px rgba(160,110,150,.28);display:flex;align-items:center;justify-content:center}
.palette:active{cursor:grabbing}
.palette .core{width:96px;height:96px;border-radius:50%;background:rgba(255,252,250,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 0 0 4px #fff,inset 0 0 18px rgba(200,160,190,.25)}
.palette .core .d{font-size:12px;font-weight:800;color:#8A6E80}
.palette .core .q{font-size:10px;color:#A79BB4;padding:4px 8px;line-height:1.4}
.palette .sw{position:absolute;width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:pointer}
.palette .sw:hover{transform:scale(1.15)}
.palette.hidden-p{display:none}
.tt-cell{min-width:86px;height:34px;border:1px dashed #EBD9E4;border-radius:8px;cursor:text;font-size:12.5px;display:flex;align-items:center;justify-content:center;padding:2px 6px;text-align:center;background:#FFFEFC}
.tt-cell:hover{background:#FDF3F8;border-color:var(--pink-deep)}
.tt-cell.has{border-style:solid;background:#FBEFF5;font-weight:600;color:#9A4E70}
.tt-cell[draggable=true]{cursor:move}
.tt-time{font-size:11.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;padding:0 6px;border-radius:6px}
.tt-time:hover{background:var(--butter)}
.cd-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:12px;background:#FDF7FA;margin-bottom:8px;border:1px solid #F6E8EF}
.cd-item.soon{background:#FDEDED;border-color:#F5C6C6;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(227,109,109,.25)}50%{box-shadow:0 0 0 6px rgba(227,109,109,0)}}
.cd-item .days{font-size:20px;font-weight:800;color:#B25A80;white-space:nowrap}
.cd-item.soon .days{color:#C0392B}
.todo-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:6px;background:#FDF7FA;border:1px solid #F6E8EF}
.todo-item.done{opacity:.45;text-decoration:line-through}
.todo-item .t{flex:1;min-width:0}
.todo-item .t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-item .t span{font-size:11px;color:var(--ink-2)}
.news-item{padding:9px 0;border-bottom:1px dashed #F0E2EA}
.news-item b{font-size:13px;display:block;margin-bottom:3px}
.news-item p{font-size:12px;color:var(--ink-2);line-height:1.5}
.news-item .src{font-size:11px;color:#C4B4C6}

/* ---------- 座位表 ---------- */
.seat-grid{display:flex;flex-direction:column;gap:10px;align-items:center;overflow-x:auto;padding:10px}
.seat-row{display:flex;gap:10px;align-items:center}
.seat-row .rowlab{font-size:11px;color:#C4B4C6;width:34px;text-align:center;flex:none}
.seat{width:88px;min-height:44px;border-radius:10px;background:#FDF3F8;border:1.5px solid #F0DCE8;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:#7A5570;cursor:grab;padding:4px;text-align:center}
.seat:empty{border-style:dashed;color:#D8C8DC;cursor:default}
.seat.gap{margin-right:26px}
.seat.single{background:#F2F6F4;border-color:#D9E8E0;color:#4E7A66}
.seat.dragover{border-color:var(--mint-deep);background:#E4F3EC}
.seat.front-row{box-shadow:0 0 0 2px var(--butter-deep) inset}

/* ---------- 值日表 ---------- */
.duty-table td,.duty-table th{text-align:center;font-size:12.5px}
.duty-table td[contenteditable]{cursor:text;min-width:78px}
.duty-table td[contenteditable]:focus{background:#FDF3F8;outline:2px solid var(--pink-deep);border-radius:6px}

/* ---------- 锦囊妙招 ---------- */
.tip-out{background:#FBF7FC;border:1px solid #EFE3F4;border-radius:12px;padding:16px;line-height:1.9;font-size:13.5px;white-space:pre-wrap}
.doc-outline{border-left:3px solid var(--pink-deep);padding-left:14px;font-size:13px;line-height:2;color:#6A5A78}

/* ---------- 工作流 ---------- */
.wf-todo{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #F3E7EE;margin-bottom:8px}
.wf-todo.overdue{border-color:#F5C6C6;background:#FDF2F2}
.wf-todo .time{font-size:12px;font-weight:800;color:#B25A80;white-space:nowrap;min-width:56px}
.wf-todo.overdue .time{color:#C0392B}
.wf-todo .body{flex:1;min-width:0}
.wf-todo .body b{font-size:13.5px;display:block}
.wf-todo .body p{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.qa-grid{grid-template-columns:repeat(2,1fr)}}
.qa-btn{background:linear-gradient(135deg,#fff,#FBF2F7);border:1px solid #F2E2EC;border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:.15s;font-size:13px;font-weight:600;color:#7A5570}
.qa-btn:hover{transform:translateY(-2px);border-color:var(--pink-deep)}
.qa-btn .ic{font-size:22px;display:block;margin-bottom:6px}

/* ---------- 打印 ---------- */
@media print{
  body{background:#fff}
  .topbar,.sidebar,.no-print,#toastWrap,.modal-mask{display:none!important}
  .main{overflow:visible;padding:0}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
}
.site-card{display:flex;flex-direction:column;gap:4px;background:linear-gradient(135deg,#fff,#FBF4F8);border:1px solid #F3E5EE;border-radius:14px;padding:16px;cursor:pointer;transition:.15s;text-decoration:none;color:var(--ink)}
.site-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--pink-deep)}
.site-card b{font-size:14px}.site-card span{font-size:12px;color:var(--ink-2)}
.site-card .ic{font-size:20px}

/* ---------- 代收费管理 ---------- */
.agency-paid{background:#F0FAF4 !important}
.agency-paid .agency-amt{background:#eee;color:#888}
.agency-tb td,.agency-tb th{padding:6px 8px;font-size:12.5px}

/* ---------- 数据备份与恢复 ---------- */
.backup-card{display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(135deg,#F0FAFF,#F5F8FF);border:1.5px solid #D6EAFF;border-radius:16px;margin-bottom:10px;cursor:pointer;transition:.2s}
.backup-card:hover{border-color:#7DB4E8;box-shadow:0 3px 12px rgba(100,160,220,.15)}
.backup-card b{font-size:13.5px}.backup-card .hint{font-size:11.5px}
.backup-warn{background:linear-gradient(135deg,#FFF9F0,#FFF5E6);border-color:#FFE0B2}

/* ============ 移动端适配（≤768px） ============ */
@media (max-width:768px){
  /* 顶栏精简 */
  .topbar{height:52px;padding:0 10px}
  .brand-ver,.theme-dot{display:none}
  .brand-name{font-size:14px}
  .topbar-date{font-size:11px;padding:3px 9px}
  .icon-btn{width:32px;height:32px}

  /* 侧边栏：覆盖式抽屉（不推内容） */
  .sidebar{position:fixed;top:52px;bottom:0;left:0;width:230px;z-index:30;margin-left:0;
    transform:translateX(-100%);transition:transform .25s;box-shadow:4px 0 24px rgba(120,80,110,.22)}
  .sidebar.collapsed{transform:translateX(-100%)}
  .sidebar:not(.collapsed){transform:translateX(0)}
  .main{padding:12px 12px 72px}
  #view{max-width:100%}
  .nav-mask{position:fixed;inset:52px 0 0 0;background:rgba(74,63,85,.35);z-index:25;display:none}
  .nav-mask.show{display:block}

  /* 通用组件触摸友好 */
  .card{padding:14px;margin-bottom:14px}
  .btn{min-height:42px;font-size:14px;padding:9px 15px}
  .btn.sm{min-height:34px;padding:5px 11px}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{font-size:14px;min-height:40px;padding:8px 10px}
  textarea{min-height:96px}
  .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr}
  .qa-grid{grid-template-columns:repeat(2,1fr)}
  .card-title{flex-wrap:wrap;gap:8px}
  .tabs .tab{padding:8px 13px;font-size:12.5px}

  /* 表格 / 课表横向滚动 */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.tb{font-size:12px}
  table.tb th,table.tb td{padding:6px 8px}
  #ttWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tt-cell{min-width:70px;font-size:11.5px}

  /* 座位表横滑 */
  .seat-grid{overflow-x:auto;align-items:stretch}
  .seat{width:72px;min-height:42px;font-size:11.5px}

  /* 弹窗 */
  .modal{width:94vw;max-height:88vh}
  .modal-body{padding:14px}

  /* 调色盘：手机居中、不拖拽 */
  .palette-wrap{min-height:auto;display:flex;justify-content:center;padding:8px 0}
  .palette{position:relative;margin:0 auto;width:140px;height:140px}
  .palette .sw{width:30px;height:30px}
}

</style>
</head>
<body>
<div id="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <button id="navToggle" class="icon-btn" title="展开/收起导航">☰</button>
      <div class="brand">
        <span class="brand-name">TEACHER WORKSPACE</span>
        <span class="brand-ver">v2.0 · 智能化教学管理平台</span>
      </div>
    </div>
    <div class="topbar-right">
      <button id="aiGear" class="icon-btn" title="AI 设置" onclick="openAISettings()" style="margin-right:10px">🤖</button>
      <span class="topbar-date" id="topDate"></span>
      <span class="theme-dot pink"></span><span class="theme-dot mint"></span><span class="theme-dot lav"></span><span class="theme-dot butter"></span>
    </div>
  </header>
  <div class="layout">
    <!-- 左侧导航 -->
    <aside class="sidebar" id="sidebar">
      <nav class="nav-tree" id="navTree"></nav>
      <div class="sidebar-foot">奶油马卡龙 · 主题</div>
    </aside>
    <div id="navMask" class="nav-mask"></div>
    <!-- 主内容区 -->
    <main class="main" id="main">
      <div id="view"></div>
    </main>
  </div>
</div>
<!-- 通用弹窗 -->

  <div class="modal" id="modalBox">

/* ---------- CSV 解析 / 导出 ---------- */
function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/\r\n?/g, '\n').replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++){ const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',' || c === '\t'){ row.push(cur); cur = ''; }
    else if (c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c; }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function dlBlob(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;

function exportCSV(filename, rows){
  const csv = '\uFEFF' + rows.map(r => r.map(c => { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c; }).join(',')).join('\n');
  dlBlob(filename, new Blob([csv], {type: 'text/csv;charset=utf-8'})); }

  h1,h2,h3{font-family:"${s.titleFont}"}h1{font-size:${s.titleSize==='三号'?'16pt':s.titleSize==='小三'?'15pt':'14pt'};text-align:center;text-indent:0}
  table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:4px 6px;font-size:10.5pt}</style></head><body>${innerHTML}</body></html>`;
  dlBlob(filename + '.doc', new Blob(['\ufeff' + html], {type: 'application/msword'})); }

/* ---------- 表头模糊匹配 ---------- */
function matchHeaders(headerRow, fields){
  const map = {}; const used = new Set();
  fields.forEach(f => { const keys = f.split('|');
    for (let i = 0; i < headerRow.length; i++){ if (used.has(i)) continue;
      const h = String(headerRow[i] || '').trim();
      if (keys.some(k => h === k) || keys.some(k => h.includes(k) && h.length <= k.length + 4)) { map[f] = i; used.add(i); return; } } });
  return map; }

/* ---------- 语音转文字（浏览器内置） ---------- */
function speechToText(targetSel, onEnd){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ toast('当前浏览器不支持语音识别，请使用 Chrome/Edge 或手动输入', 'warn'); return; }
  const rec = new SR(); rec.lang = 'zh-CN'; rec.continuous = true; rec.interimResults = false;
  let txt = '';
  rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) txt += e.results[i][0].transcript; };
  rec.onend = () => { const t = $(targetSel); if (t){ t.value = (t.value ? t.value + ' ' : '') + txt; } if (onEnd) onEnd(txt); };
  rec.onerror = () => toast('语音识别失败，请手动输入', 'err');
  rec.start(); toast('🎙️ 开始录音，请说话…');
  return rec; }

/* ---------- 核心调用（SSE 流式） ---------- */
let _aiAbort = null;
function aiAbort(){ if (_aiAbort){ try{ _aiAbort.abort(); }catch(e){} _aiAbort = null; } }
async function aiChat(messages, opt){
  opt = opt || {};
  const c = aiCfg();
  if (!c.key) throw new Error('未配置 API Key（点击顶栏 🤖 按钮设置）');
  _aiAbort = new AbortController();
  let res;
  try{
    res = await fetch(c.baseUrl + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
      body: JSON.stringify({
        model: c.model, messages, stream: true,
        temperature: opt.temperature != null ? opt.temperature : 1.0,
        max_tokens: opt.maxTokens || 4096
      }),
      signal: _aiAbort.signal
    });
  }catch(e){
    _aiAbort = null;
    if (e.name === 'AbortError') throw new Error('已取消生成');
    throw new Error('网络请求失败（' + e.message + '）。若为跨域/网络问题，可尝试用本地服务器打开页面，或检查接口地址');
  }
  _aiAbort = null;
  if (!res.ok){
    let msg = 'HTTP ' + res.status;
    try{ const j = await res.json(); if (j.error && j.error.message) msg = j.error.message; }catch(e){}
    if (res.status === 401) msg += '：API Key 无效或已过期';
    if (res.status === 402) msg += '：账户余额不足，请到 platform.deepseek.com 充值';
    if (res.status === 429) msg += '：请求过于频繁，请稍后再试';
    throw new Error(msg);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', full = '';
  while (true){
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines){
      const s = line.trim();
      if (!s.startsWith('data:')) continue;
      const payload = s.slice(5).trim();
      if (payload === '[DONE]') continue;
      try{
        const j = JSON.parse(payload);
        const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if (d){ full += d; if (opt.onDelta) opt.onDelta(d, full); }
      }catch(e){}
    }
  }
  if (!full.trim()) throw new Error('模型未返回内容，请重试');
  return full;
}

/* ---------- 从 AI 输出中提取 JSON ---------- */
function aiExtractJSON(txt){
  if (!txt) return null;
  const fenced = txt.match(/```(?:json)?\s*([\s\S]*?)```/);
  const body = fenced ? fenced[1] : txt;
  const starts = [];
  for (const ch of ['{', '[']){ let i = -1; while ((i = body.indexOf(ch, i + 1)) !== -1) starts.push([i, ch]); }
  starts.sort((a, b) => a[0] - b[0]);
  for (const [i, ch] of starts){
    const endCh = ch === '{' ? '}' : ']';
    let depth = 0, inStr = false, escp = false;
    for (let j = i; j < body.length; j++){
      const c = body[j];
      if (escp){ escp = false; continue; }
      if (c === '\\'){ if (inStr) escp = true; continue; }
      if (c === '"'){ inStr = !inStr; continue; }
      if (inStr) continue;
      if (c === ch) depth++;
      else if (c === endCh){ depth--; if (depth === 0){
        try{ return JSON.parse(body.slice(i, j + 1)); }catch(e){ break; }
      } }
    }
  }
  return null;
}

/* ---------- 调色盘 ---------- */
const SWATCHES = ['#F48FB1','#A5D6C9','#B39DDB','#F6D98A','#F8BBD0','#FFCCBC','#B2DFDB','#E1BEE7'];
function paletteHTML(){
  if (DB.palette.hidden) return `<button class="btn sm ghost" onclick="DB.palette.hidden=false;dbSave();rerenderPalette()">🎨 显示调色盘</button>`;
  const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
  const sw = SWATCHES.map((c, i) => { const a = (i / SWATCHES.length) * Math.PI * 2 - Math.PI / 2;
    return `<div class="sw" style="background:${c};left:${62 + 58 * Math.cos(a) - 13}px;top:${62 + 58 * Math.sin(a) - 13}px" title="${c}" onclick="pickColor('${c}')"></div>`; }).join('');
  return `<div class="palette" id="palette" style="left:${DB.palette.x}px;top:${DB.palette.y}px">
    <div class="core"><div class="d">${fmtCN(todayStr())}</div><div class="q">${esc(q)}</div></div>${sw}</div>`;
}
/* 颜色解析：支持 #hex / #rgb / rgb() 三种写法 */
function hexToRgb(c){
  c = (c || '').trim();
  if (c[0] === '#'){ let h = c.slice(1); if (h.length === 3) h = h.split('').map(x => x + x).join(''); if (/^[0-9a-fA-F]{6}$/.test(h)) return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  const m = c.match(/rgba?\(([^)]+)\)/i); if (m){ const p = m[1].split(',').map(x => parseFloat(x)); return [p[0]||0, p[1]||0, p[2]||0]; }
  return null;
}
const _clamp = v => Math.max(0, Math.min(255, Math.round(v)));
/* 应用主题色：同时改主色 --pink（按钮/导航/顶栏，肉眼可见）和深一档的 --pink-deep（边框/悬停） */
function applyPaletteColor(c){
  const base = hexToRgb(c) || [249, 213, 224];           // 默认奶油粉 #F9D5E0
  const main = base.map(_clamp);
  const deep = main.map(v => _clamp(v * 0.78));
  const rs = a => `rgb(${a[0]},${a[1]},${a[2]})`;
  document.documentElement.style.setProperty('--pink', rs(main));
  document.documentElement.style.setProperty('--pink-deep', rs(deep));
}
function pickColor(c){
  if (!hexToRgb(c)) return;
  applyPaletteColor(c);
  DB.palette.color = c; dbSave();
  toast('已应用主题色 ' + c);
}
function rerenderPalette(){ const w = $('#paletteWrap'); if (w){ w.innerHTML = paletteHTML(); initPalette(); } }
/* 启动时恢复已保存的主题色（刷新/重开不丢失） */
function applySavedPalette(){ if (DB.palette && DB.palette.color) applyPaletteColor(DB.palette.color); }
function initPalette(){
  const p = $('#palette'); if (!p) return;
  let sx, sy, ox, oy, moved = false, pressT = null, dragged = false;
  // 色块点击：使用事件委托确保可靠触发
  p.addEventListener('pointerdown', e => {
    // 触屏设备：不启用拖拽/长按，选色交由 click 处理
    if (e.pointerType === 'touch') return;
    // 点击色块 → 直接选色（不进入拖拽逻辑）
    if (e.target.classList.contains('sw')){
      const c = e.target.title || e.target.style.background;
      if (c){ pickColor(c); e.preventDefault(); }
      return;
    }
    pressT = setTimeout(() => { DB.palette.hidden = true; dbSave(); rerenderPalette(); toast('调色盘已隐藏'); }, 700);
    sx = e.clientX; sy = e.clientY; ox = parseFloat(p.style.left); oy = parseFloat(p.style.top); moved = false;
    p.setPointerCapture(e.pointerId);
  });
  // 兜底：click 事件也处理色块（应对 pointerdown 被其他逻辑吞掉的情况）
  p.addEventListener('click', e => {
    if (e.target.classList.contains('sw')){
      const c = e.target.title || e.target.style.background;
      if (c) pickColor(c);
    }
  });
  p.addEventListener('pointermove', e => {
    if (!p.hasPointerCapture || !p.hasPointerCapture(e.pointerId)) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 4){ moved = true; clearTimeout(pressT); }
    if (moved){ dragged = true;
      const wrap = $('#paletteWrap').getBoundingClientRect();
      p.style.left = Math.max(0, Math.min(wrap.width - 150, ox + dx)) + 'px';
      p.style.top = Math.max(0, Math.min(wrap.height - 150, oy + dy)) + 'px'; }
  });
  p.addEventListener('pointerup', () => { clearTimeout(pressT);
    if (dragged){ DB.palette.x = parseFloat(p.style.left); DB.palette.y = parseFloat(p.style.top); dbSave(); dragged = false; } });
}

  if (!n.items.length) return `<div class="empty">暂无早报内容<br><span class="hint" style="display:block;margin-top:6px">点击「刷新新闻」生成今日份教育早报<br>${aiConfigured() ? '已接入 AI，将按你的关注方向（教育政策/数学教学/青少年安全心理）真实生成' : '（点击顶栏 🤖 配置 DeepSeek API Key 后，可由 AI 真实生成）'}</span></div>`;
  const catTag = c => c === '政策' ? 'pink' : c === '教学' ? 'mint' : 'lav';
  return n.items.map(i => `<div class="news-item"><b>${esc(i.title)}</b><p>${esc(i.abs)}</p>
    <span class="src">来源：${esc(i.src)} · <span class="tag ${catTag(i.cat)}">${esc(i.cat)}</span></span></div>`).join('') +
    `<div style="margin-top:10px;padding:10px;background:#FDF7FA;border-radius:10px"><b style="font-size:13px">📌 今日教学行动清单</b>
    <ul style="margin:6px 0 0 18px;font-size:12.5px;line-height:1.9">${n.actions.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>
    <div class="hint" style="margin-top:6px">更新时间：${n.updated} · 聚焦教育政策/数学教学/青少年安全心理，已过滤娱乐八卦与负面新闻 · 说“新闻调整：[内容]”可修改筛选规则</div>`;
}
function refreshNews(){
  if (aiConfigured()) return refreshNewsAI();
  refreshNewsLocal();
  toast('教育早报已更新（本地示例数据，点击顶栏 🤖 配置 AI 后可真实生成）');
}
async function refreshNewsAI(){
  $('#newsBox').innerHTML = '<div class="empty">🤖 AI 正在为你生成今日教育早报…<br><span class="hint" style="display:block;margin-top:6px">首次生成约需 20-40 秒</span></div>';
  try{
    const d = new Date();
    const txt = await aiChat([
      { role: 'system', content: '你是一位资深教育媒体编辑，为一位初中数学教师兼班主任编写每日教育早报，只关注教育政策、数学教学、青少年安全与心理，过滤娱乐八卦和负面社会新闻。' },
      { role: 'user', content: `今天是${fmtCN(todayStr())}（星期${weekOfDay()}）。请生成一份教育早报。注意：你无法实时联网，请基于你已有的知识，汇总近期教育领域的重点政策动向、教学教研趋势与青少年身心健康热点，内容须真实可核、不编造具体文件名与文号、不确定的日期用模糊表述（如“近期”“今年以来”）。\n严格输出 JSON（不要任何多余文字）：\n{"items":[{"cat":"政策|教学|热点","title":"标题","abs":"40-70字摘要","src":"来源名"}],"actions":["行动清单1","行动清单2","行动清单3"]}\n其中 items 为 5-7 条，actions 为 3 条今日可执行的教学行动建议。` }
    ], { temperature: 1.3, maxTokens: 2048 });
    const j = aiExtractJSON(txt);
    const items = (j && Array.isArray(j.items) && j.items.filter(x => x.title && x.abs).length) ? j.items.filter(x => x.title && x.abs) : null;
    if (!items) throw new Error('AI 返回格式异常');
    DB.news = { items, actions: (Array.isArray(j.actions) && j.actions.length ? j.actions : ['查看本周课表，确认教学进度', '批改昨日作业，标记高频错题', '与1名临界生简短谈心']).slice(0, 3),
      updated: fmtCN(todayStr()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) };
    dbSave(); $('#newsBox').innerHTML = newsHTML();
    toast('AI 早报已生成（基于模型知识库，非实时联网检索）');
  }catch(e){
    refreshNewsLocal();
    toast('AI 生成失败，已使用本地示例：' + e.message, 'err');
  }
}

<script>
/* ================= 学科教学 · 智能出题中心 ================= */
const CHAPTERS = ['二次函数','相似三角形','锐角三角函数','概率初步','一元二次方程','圆','一次函数','三角形','四边形','统计','数与式','方程与不等式','反比例函数'];
const QTYPES = ['选择题','填空题','解答题','证明题','应用题','阅读理解'];
const DIFF_NAMES = { 1:'基础(★)', 2:'★★', 3:'中档(★★★)', 4:'★★★★', 5:'压轴(★★★★★)' };

/* ---------------- 3.1 题库总览 ---------------- */
regRoute('#/teach/bank', v => {
  v.innerHTML = `
  <div class="card">
    <div class="card-title"><h3>🗂️ 题库总览</h3><span class="sub">上传试卷自动入库 · 多维度检索 · 组卷优先抽取</span></div>
    <div class="grid g4" style="margin-bottom:14px">
      <div class="stat-card"><div class="num">${DB.bank.questions.length}</div><div class="lab">已入库总题数</div></div>
      <div class="stat-card mint"><div class="num">${new Set(DB.bank.questions.map(q => q.chapter)).size}</div><div class="lab">覆盖章节数</div></div>
      <div class="stat-card lav"><div class="num">${new Set(DB.bank.questions.map(q => q.type)).size}</div><div class="lab">覆盖题型数</div></div>
      <div class="stat-card butter"><div class="num" style="font-size:14px;line-height:2.1">${DB.bank.files[0] ? esc(DB.bank.files[0].time) : '—'}</div><div class="lab">最近更新时间</div></div>
    </div>
    <div class="toolbar">
      <button class="btn" onclick="$('#bankFile').click()">⬆️ 上传题库文件</button>
      <input type="file" id="bankFile" multiple accept=".docx,.pdf,.jpg,.png,.csv,.txt" style="display:none">
      <button class="btn mint" onclick="addQuestion()">＋ 手动录题</button>
      <span class="sp"></span>
      <select id="qfChapter"><option value="">全部章节</option>${CHAPTERS.map(c => `<option>${c}</option>`).join('')}</select>
      <select id="qfType"><option value="">全部题型</option>${QTYPES.map(c => `<option>${c}</option>`).join('')}</select>
      <select id="qfDiff"><option value="">全部难度</option>${[1,2,3,4,5].map(d => `<option value="${d}">${DIFF_NAMES[d]}</option>`).join('')}</select>
      <input type="text" id="qfKw" placeholder="搜索题干/知识点">
    </div>
    <div id="bankStats"></div>
  </div>
  <div class="card"><div class="card-title"><h3>📋 题目列表</h3><span class="sub">勾选可批量删除（需二次确认）</span></div>
    <div id="bankList"></div></div>
  <div class="card"><div class="card-title"><h3>📁 最近上传记录</h3></div><div id="bankFiles"></div></div>`;
  $('#qfChapter').onchange = $('#qfType').onchange = $('#qfDiff').onchange = $('#qfKw').oninput = renderBankList;
  $('#bankFile').onchange = e => bankUpload(e.target.files);
  renderBankStats(); renderBankList(); renderBankFiles();
});

function bankUpload(files){
  Array.from(files).forEach(f => {
    DB.bank.files.unshift({ name: f.name, time: new Date().toLocaleString('zh-CN'), chapters: [] });
    if (/\.(csv|txt)$/i.test(f.name)){
      const r = new FileReader();
      r.onload = () => { const rows = parseCSV(r.result);
        if (rows.length > 1){ const head = rows[0].map(h => h.trim());
          rows.slice(1).forEach(row => { const get = n => { const i = head.findIndex(h => h.includes(n)); return i >= 0 ? row[i] : ''; };
            const stem = get('题干') || get('题目');
            if (stem) DB.bank.questions.push({ id: uid(), chapter: get('章节') || '未分类', type: get('题型') || '选择题',
              diff: Math.min(5, Math.max(1, +get('难度') || 3)), know: (get('知识点') || '').split(/[;；、\s]+/).filter(Boolean).slice(0, 5),
              stem, answer: get('答案'), analysis: get('解析'), source: get('来源') || f.name, year: get('年份') || String(new Date().getFullYear()) }); });
          toast('已解析入库 ' + (rows.length - 1) + ' 道题'); dbSave(); renderBankStats(); renderBankList(); renderBankFiles(); } };
      r.readAsText(f, 'utf-8');
    } else {
      // docx/pdf/图片：登记文件，题目由 WorkBuddy AI 对话解析后手动/批量入库
      toast('已登记文件「' + f.name + '」，docx/pdf/图片解析请在对话中发送“解析这份试卷入库”');
    }
  });
  dbSave(); renderBankFiles();
}
function addQuestion(){
  openModal('手动录题', `
    <div class="grid g2">
      <div class="field"><label class="fl">章节</label><select id="nqChapter">${CHAPTERS.map(c => `<option>${c}</option>`).join('')}</select></div>
      <div class="field"><label class="fl">题型</label><select id="nqType">${QTYPES.map(c => `<option>${c}</option>`).join('')}</select></div>
      <div class="field"><label class="fl">难度（1-5星）</label><select id="nqDiff">${[1,2,3,4,5].map(d => `<option value="${d}" ${d===3?'selected':''}>${DIFF_NAMES[d]}</option>`).join('')}</select></div>
      <div class="field"><label class="fl">来源/年份</label><input type="text" id="nqSrc" placeholder="如：本校卷 2026"></div></div>
    <div class="field"><label class="fl">知识点（3-5个，顿号分隔）</label><input type="text" id="nqKnow" placeholder="如：配方法、顶点坐标、最值"></div>
    <div class="field"><label class="fl">题干</label><textarea id="nqStem"></textarea></div>
    <div class="grid g2"><div class="field"><label class="fl">答案</label><textarea id="nqAns" style="min-height:50px"></textarea></div>
    <div class="field"><label class="fl">解析</label><textarea id="nqAnalysis" style="min-height:50px"></textarea></div></div>
    <div style="text-align:right"><button class="btn" onclick="saveQuestion()">入库</button></div>`, true);
}
function saveQuestion(){
  if (!$('#nqStem').value.trim()) return toast('请填写题干', 'warn');
  DB.bank.questions.push({ id: uid(), chapter: $('#nqChapter').value, type: $('#nqType').value, diff: +$('#nqDiff').value,
    know: $('#nqKnow').value.split(/[;；、\s]+/).filter(Boolean), stem: $('#nqStem').value.trim(),
    answer: $('#nqAns').value.trim(), analysis: $('#nqAnalysis').value.trim(),
    source: ($('#nqSrc').value.trim() || '手动录入').split(' ')[0], year: ($('#nqSrc').value.match(/\d{4}/) || [String(new Date().getFullYear())])[0] });
  dbSave(); closeModal(); toast('题目已入库'); if ($('#bankList')) { renderBankStats(); renderBankList(); }
}
function bankFiltered(){
  const c = $('#qfChapter').value, t = $('#qfType').value, d = $('#qfDiff').value, kw = $('#qfKw').value.trim();
  return DB.bank.questions.filter(q => (!c || q.chapter === c) && (!t || q.type === t) && (!d || +q.diff === +d) &&
    (!kw || (q.stem + (q.know || []).join('')).includes(kw)));
}
function renderBankStats(){
  const qs = DB.bank.questions; const el = $('#bankStats'); if (!el) return;
  const byCh = {}; qs.forEach(q => { (byCh[q.chapter] = byCh[q.chapter] || { n: 0, b: 0, m: 0, h: 0 });
    byCh[q.chapter].n++; const g = q.diff <= 2 ? 'b' : q.diff === 3 ? 'm' : 'h'; byCh[q.chapter][g]++; });
  const cnt = a => Object.entries(a).map(([k, v]) => [k, v]).sort((x, y) => y[1].n - x[1].n);
  const b = qs.filter(q => q.diff <= 2).length, m = qs.filter(q => q.diff === 3).length, h = qs.filter(q => q.diff >= 4).length;
  const tot = qs.length || 1;
  el.innerHTML = `<div class="grid g2">
    <div><b style="font-size:13px">📚 按章节分布（点击进入详情）</b>
      <table class="tb" style="margin-top:6px"><tr><th>章节</th><th>题量</th><th>基础</th><th>中档</th><th>压轴</th></tr>
      ${cnt(byCh).map(([c, s]) => `<tr><td><a href="javascript:void(0)" style="color:#B25A80;font-weight:600" onclick="bankChapter('${esc(c)}')">${esc(c)}</a></td><td>${s.n}</td><td>${s.b}</td><td>${s.m}</td><td>${s.h}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">暂无数据</td></tr>'}</table></div>
    <div><b style="font-size:13px">📊 难度 / 来源 / 年份分布</b>
      <div style="margin:8px 0 4px;font-size:12.5px">基础题 ${b}（${Math.round(b/tot*100)}%）</div><div class="bar-wrap"><i style="width:${b/tot*100}%"></i></div>
      <div style="margin:8px 0 4px;font-size:12.5px">中档题 ${m}（${Math.round(m/tot*100)}%）</div><div class="bar-wrap"><i style="width:${m/tot*100}%;background:linear-gradient(90deg,#E0B95E,#F6D98A)"></i></div>
      <div style="margin:8px 0 4px;font-size:12.5px">压轴题 ${h}（${Math.round(h/tot*100)}%）</div><div class="bar-wrap"><i style="width:${h/tot*100}%;background:linear-gradient(90deg,#A393D6,#C9BCE8)"></i></div>
      <table class="tb" style="margin-top:10px"><tr><th>来源</th><th>题量</th><th>年份</th><th>题量</th></tr>
      ${(()=>{ const s={},y={}; qs.forEach(q=>{s[q.source||'未标注']=(s[q.source||'未标注']||0)+1;y[q.year||'—']=(y[q.year||'—']||0)+1;});
        const se=Object.entries(s).sort((a,b)=>b[1]-a[1]), ye=Object.entries(y).sort((a,b)=>b[0].localeCompare(a[0]));
        const n=Math.max(se.length,ye.length); return Array.from({length:n},(_,i)=>`<tr><td>${esc(se[i]?se[i][0]:'')}</td><td>${se[i]?se[i][1]:''}</td><td>${esc(ye[i]?ye[i][0]:'')}</td><td>${ye[i]?ye[i][1]:''}</td></tr>`).join(''); })()}</table></div></div>`;
}
function renderBankList(){
  const el = $('#bankList'); if (!el) return;
  const list = bankFiltered().sort((a, b) => a.diff - b.diff);
  if (!list.length) return el.innerHTML = `<div class="empty">暂无符合条件的题目，请先上传题库文件或手动录题</div>`;
  el.innerHTML = `<div class="table-wrap"><table class="tb"><tr><th><input type="checkbox" onchange="$$('.qchk').forEach(c=>c.checked=this.checked)"></th><th>题号</th><th>难度</th><th>题型</th><th>章节</th><th>题目摘要</th><th>知识点</th><th>来源</th><th>操作</th></tr>
    ${list.map(q => { const i = DB.bank.questions.indexOf(q);
      return `<tr><td><input type="checkbox" class="qchk" data-id="${q.id}"></td><td>${i + 1}</td>
      <td><span class="tag ${q.diff <= 2 ? 'mint' : q.diff === 3 ? 'butter' : 'lav'}">${DIFF_NAMES[q.diff] || q.diff}</span></td>
      <td>${esc(q.type)}</td><td>${esc(q.chapter)}</td>
      <td style="max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(q.stem)}">${esc(q.stem)}</td>
      <td style="font-size:12px;color:#8A7A9A">${esc((q.know || []).join('、'))}</td><td style="font-size:12px">${esc(q.source)} ${esc(q.year)}</td>
      <td class="no-print"><button class="btn sm ghost" onclick="viewQuestion('${q.id}')">详情</button>
      <button class="btn sm danger" onclick="delQuestion('${q.id}')">删除</button></td></tr>`; }).join('')}</table></div>
    <div style="margin-top:8px"><button class="btn danger sm" onclick="batchDelQuestions()">🗑️ 批量删除勾选题</button>
    <span class="hint">显示 ${list.length} 道 · 所有删除操作均需二次确认</span></div>`;
}
function renderBankFiles(){
  const el = $('#bankFiles'); if (!el) return;
  el.innerHTML = DB.bank.files.length ? `<table class="tb"><tr><th>文件名</th><th>上传时间</th><th>章节/难度标签</th><th>操作</th></tr>
    ${DB.bank.files.map((f, i) => `<tr><td>${esc(f.name)}</td><td>${esc(f.time)}</td><td>${esc(f.chapters.join('、') || '待解析')}</td>
    <td><button class="btn sm danger" onclick="delBankFile(${i})">删除</button></td></tr>`).join('')}</table>`
    : `<div class="empty">暂无上传记录（建议先上传 5 份最信任的试卷测试建库效果）</div>`;
}

function parseNeed(){
  const t = $('#needText').value.trim();
  if (!t) return toast('请输入需求描述', 'warn');
  const chapters = {}; let m;
  const re1 = /([\u4e00-\u9fa5]{2,8})\s*(\d{1,2})\s*%/g;
  while ((m = re1.exec(t))) if (CHAPTERS.includes(m[1])) chapters[m[1]] = +m[2];
  const diffMatch = t.match(/难度\s*(\d)\s*[:：]\s*(\d)\s*[:：]\s*(\d)/);
  const types = []; const re2 = /(选择|填空|解答|证明|应用)(?:题)?\s*(\d{1,2})\s*道/g;
  while ((m = re2.exec(t))) types.push({ type: m[1] + '题', n: +m[2] });
  const total = +(t.match(/总分\s*(\d{1,3})/)?.[1] || 100);
  const mins = +(t.match(/(\d{1,3})\s*分钟/)?.[1] || 90);
  const name = t.match(/(初三|初二|初一|七年级|八年级|九年级)?/)[0] + '综合卷';
  if (!types.length) types.push({ type: '选择题', n: 10 }, { type: '填空题', n: 5 }, { type: '解答题', n: 5 });
  if (!Object.keys(chapters).length) chapters['二次函数'] = 40, chapters['圆'] = 30, chapters['一次函数'] = 20, chapters['概率初步'] = 10;
  const dR = diffMatch ? [+diffMatch[1], +diffMatch[2], +diffMatch[3]] : [4, 3, 3];
  const dSum = dR[0] + dR[1] + dR[2];
  const nAll = types.reduce((s, x) => s + x.n, 0);
  paperPlan = { name: name || '综合卷', chapters, types, total, mins,
    diff: { b: Math.round(nAll * dR[0] / dSum), m: Math.round(nAll * dR[1] / dSum), h: nAll - Math.round(nAll * dR[0] / dSum) - Math.round(nAll * dR[1] / dSum) },
    kpi: (0.62 + Math.min(0.15, (dR[2] / dSum) * 0.3)).toFixed(2), avg: Math.round(total * (0.62 + (dR[0] / dSum) * 0.15)) };
  renderPaperOut();
  toast('组卷方案已生成，请确认');
}

/* ---------- AI 补全生成题（真实命制） ---------- */
async function aiFillPaper(){
  if (!paperResult) return;
  const stubs = paperResult.rows.filter(r => r.from === 'AI生成' && String(r.q.id).indexOf('ai_') === 0);
  if (!stubs.length) return toast('当前试卷没有需要 AI 补全的题目', 'warn');
  const onDelta = aiStreamBox('🤖 AI 补全生成题', `正在为 ${stubs.length} 个题位真实命制原创题（流式生成中，完成后自动替换占位题）…`);
  try{
    const list = stubs.map(r => `第${r.no}题：${r.type}，章节「${r.q.chapter}」，难度${DIFF_NAMES[r.q.diff] || '中档'}，每题约${r.per}分`).join('\n');
    const txt = await aiChat([
      { role: 'system', content: '你是经验丰富的初中数学命题教师，擅长命制原创、梯度合理、表述严谨的试题。' },
      { role: 'user', content: `请为下列试卷题位各命制一道完整的初中数学原创题：\n${list}\n\n要求：题干完整规范；选择题必须附 A、B、C、D 四个选项；答案明确（选择题给字母，解答题给关键结果）；解析含关键解题步骤，50-120字。\n严格输出 JSON 数组（不要任何多余文字）：\n[{"no":题号,"stem":"完整题干（选择题含选项，选项内换行用\\n）","answer":"答案","analysis":"解析"}]` }
    ], { temperature: 1.2, maxTokens: 4096 });
    const arr = aiExtractJSON(txt);
    if (!arr || !Array.isArray(arr) || !arr.length) throw new Error('AI 返回格式异常，请重试');
    let n = 0;
    arr.forEach(x => {
      const row = paperResult.rows.find(r => r.no === x.no && String(r.q.id).indexOf('ai_') === 0);
      if (row && x.stem){ row.q = { ...row.q, stem: x.stem, answer: x.answer || '—', analysis: x.analysis || '—', source: 'AI生成' }; n++; }
    });
    paperResult.html = paperHTML(paperResult.rows, paperPlan);
    closeModal(); renderPaperOut();
    toast(`AI 已补全 ${n} 道题，可继续导出或微调`);
  }catch(e){
    closeModal();
    toast('AI 补全失败：' + e.message, 'err');
  }
}
function pickFromBank(type, chapter, diffRange){
  const pool = DB.bank.questions.filter(q => q.type === type && (!chapter || q.chapter === chapter) && q.diff >= diffRange[0] && q.diff <= diffRange[1]);
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null; }
function aiStubQ(no, type, chapter, diff){
  const hint = aiConfigured()
    ? `（AI 待生成题）${chapter}相关${type}：点击下方「🤖 AI 补全生成题」按钮，由 AI 真实命制一道难度${DIFF_NAMES[diff]}的完整题目并自动替换本题。`
    : `（AI生成题·占位）${chapter}相关${type}：请在此题位置由 AI 生成一道难度${DIFF_NAMES[diff]}的完整题目；或先上传题库后重新组卷（点击顶栏 🤖 可配置 AI）。`;
  return { id: 'ai_' + no, chapter, type, diff, know: [chapter], stem: hint, answer: 'AI生成后自动补充', analysis: 'AI生成后自动补充', source: 'AI生成' }; }
function genPaper(){
  if (!paperPlan) return;
  const per = Math.round(paperPlan.total / paperPlan.types.reduce((s, x) => s + x.n, 0));
  const chKeys = Object.keys(paperPlan.chapters);
  const used = new Set(); let no = 0; const rows = [];
  const dRanges = [[1, 2], [3, 3], [4, 5]];
  paperPlan.types.forEach((t, ti) => {
    for (let i = 0; i < t.n; i++){
      no++;
      const ch = chKeys[Math.floor(Math.random() * Math.min(chKeys.length, 3))] || '二次函数';
      const dRange = i < Math.ceil(t.n * 0.5) ? dRanges[0] : i < Math.ceil(t.n * 0.85) ? dRanges[1] : dRanges[2];
      let q = pickFromBank(t.type, ch, dRange);
      let from = '题库';
      if (!q){ q = pickFromBank(t.type, '', dRange); }
      if (!q && paperMode !== 'bank'){ q = aiStubQ(no, t.type, ch, dRange[0]); from = 'AI生成'; }
      else if (!q){ q = pickFromBank(t.type, '', [1, 5]); }
      if (!q){ q = aiStubQ(no, t.type, ch, 3); from = 'AI生成'; }
      if (used.has(q.id)) q = { ...q, id: q.id + '_v' };
      used.add(q.id);
      rows.push({ no, big: '一二三四五'[ti], type: t.type, per, q, from });
    }
  });
  const bankN = rows.filter(r => r.from === '题库').length;
  paperResult = { rows, html: paperHTML(rows, paperPlan) };
  renderPaperOut();
  toast(`试卷已生成：题库抽取 ${bankN} 题，AI生成 ${rows.length - bankN} 题（混合比例 ${(Math.round(bankN / rows.length * 100))}% / ${100 - Math.round(bankN / rows.length * 100)}%）`);
}
function paperHTML(rows, plan){
  let html = `<h2 style="text-align:center">${esc(plan.name)}</h2><p style="text-align:center">总分：${plan.total}分　考试时间：${plan.mins}分钟</p>`;
  let lastBig = '';
  rows.forEach(r => {
    if (r.big !== lastBig){ lastBig = r.big; html += `<p><b>${r.big}、${esc(r.type)}（每题约${r.per}分）</b></p>`; }
    html += `<p>${r.no}. ${esc(r.q.stem)}${r.from === 'AI生成' ? ' <span class="tag butter">AI生成</span>' : ''} <button class="btn sm ghost no-print" onclick="delPaperQ(${r.no})">删除本题</button></p>`; });
  return html;
}
function delPaperQ(no){ if (!paperResult) return;
  confirmBox('确认删除第 ' + no + ' 题？', () => {
    paperResult.rows = paperResult.rows.filter(r => r.no !== no);
    paperResult.rows.forEach((r, i) => r.no = i + 1);
    paperResult.html = paperHTML(paperResult.rows, paperPlan); renderPaperOut(); }); }
function exportPaper(){ if (!paperResult) return;
  let html = paperResult.html;
  html += `<hr><h2>参考答案与解析</h2>`;
  paperResult.rows.forEach(r => { html += `<p><b>第${r.no}题（${esc(r.q.chapter)} · ${DIFF_NAMES[r.q.diff] || ''}）</b><br>【答案】${esc(r.q.answer || '—')}<br>【解题思路】${esc(r.q.analysis || '—')}<br>【易错点】计算符号与定理适用条件<br>【同类题提示】可在「一题多变」中对本题生成变式<br>【评分标准】按步骤给分，最终结果正确${r.per}分，中间步骤酌情0.5-${Math.max(1, Math.floor(r.per / 2))}分，满分${r.per}分</p>`; });
  exportWord(paperPlan.name + '_试卷', html); }
function copyPaper(){
  const t = $('#copyText').value.trim();
  if (!t) return toast('请上传或粘贴原卷文本', 'warn');
  // 第一步：分析原卷结构
  const typeSecs = [...t.matchAll(/([一二三四五六七八九十])\s*、\s*(选择|填空|解答|证明|应用|阅读理解)题/g)].map(m => ({ big: m[1], type: m[2] + '题' }));
  const qNums = (t.match(/^\s*\d{1,2}[.、．]/gm) || []).length;
  const plan = { name: '模仿卷·新卷', chapters: {}, types: [], total: 100, mins: 90, diff: { b: Math.ceil(qNums * .4), m: Math.ceil(qNums * .3), h: Math.ceil(qNums * .3) }, kpi: '0.65', avg: 65 };
  if (typeSecs.length) typeSecs.forEach(s => plan.types.push({ type: s.type, n: Math.max(3, Math.round(qNums / typeSecs.length)) }));
  else plan.types = [{ type: '选择题', n: Math.max(3, Math.round(qNums * .4)) }, { type: '填空题', n: Math.max(2, Math.round(qNums * .2)) }, { type: '解答题', n: Math.max(2, Math.round(qNums * .4)) }];
  DB.bank.questions.slice(0, 20).forEach(q => plan.chapters[q.chapter] = (plan.chapters[q.chapter] || 0) + 10);
  if (!Object.keys(plan.chapters).length) plan.chapters = { '二次函数': 40, '圆': 30, '一次函数': 30 };
  paperPlan = plan; paperResult = null; renderPaperOut();
  const report = `《模仿出卷报告》\n原卷结构：共识别 ${qNums} 道题，大题 ${typeSecs.length || 3} 个（${(typeSecs.map(s => s.type) || []).join('、')}）\n替换策略：同知识点、同难度、同题型逐题替换\n本地库不足部分：由 AI 自动生成补齐（标注“AI生成”）`;
  genPaper();
  toast('已按原卷结构生成新卷，附《模仿出卷报告》');
  setTimeout(() => openModal('模仿出卷报告', `<pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.9">${esc(report)}</pre>`), 300);
}

function toggleAct(a){ variantActions.has(a) ? variantActions.delete(a) : variantActions.add(a); go('#/teach/variant'); }
const SCENES = [['学校','社团义卖活动'],['商店','学校小卖部'],['购买','网购团购'],['小明','李同学'],['小红','王同学'],['打车','乘公交'],['超市','文具店']];
function genVariant(){
  const stem = $('#vStem').value.trim();
  if (!stem) return toast('请粘贴原题', 'warn');
  if (!variantActions.size) return toast('请至少选择一个改造动作', 'warn');
  if (aiConfigured()) return genVariantAI(stem);
  genVariantLocal(stem);
}
async function genVariantAI(stem){
  const actMap = {
    num: '改数字（更换数值参数，保持解题思路与答案合理性不变）',
    scene: '换情景（替换为新的生活情境，考查知识点不变，如校园义卖/体育比赛/图书借阅/食堂用餐/快递物流等）',
    ask: '变问法（改变提问角度，如逆向求解、已知结果反求条件）',
    order: '调顺序（调整条件或选项的呈现顺序，不改变实质）',
    custom: '自定义改造：' + ($('#vCustom').value.trim() || '自由改造方向')
  };
  const acts = [...variantActions].map(a => actMap[a]).join('；');
  $('#vOut').style.display = '';
  $('#vBody').innerHTML = '<div class="tip-out">🤖 AI 正在生成变式题（流式输出中）…</div>';
  try{
    const txt = await aiChat([
      { role: 'system', content: '你是初中数学变式教学专家，擅长在保持知识点不变的前提下对题目进行一题多变改造。' },
      { role: 'user', content: `请对下面的原题进行改造，改造动作：${acts}。\n\n【原题】\n${stem}\n\n要求：新题题干完整、数值合理可解；给出改造说明；并按新题条件重新计算给出完整答案（含关键步骤）。\n严格输出 JSON（不要任何多余文字）：\n{"ns":"改造后的完整新题","notes":["改造说明1","改造说明2"],"answer":"新题的完整解答过程与最终答案"}` }
    ], { temperature: 1.1, maxTokens: 2048 });
    const j = aiExtractJSON(txt);
    if (!j || !j.ns) throw new Error('AI 返回格式异常，请重试');
    renderVariantOut(stem, j.ns, Array.isArray(j.notes) ? j.notes : [], j.answer || '（AI 未返回答案，可点击「生成变式题」重试）', true);
    toast('AI 变式题已生成');
  }catch(e){
    renderVariantOut(stem, stem, ['⚠️ AI 生成失败：' + e.message + '，已展示原题，可重试或使用本地规则（先在顶栏清空 AI 配置）'], '', true);
    toast('AI 生成失败：' + e.message, 'err');
  }
}
function renderVariantOut(stem, ns, notes, answer, isAI){
  window._lastVariant = { stem, ns, notes, answer };
  $('#vOut').style.display = '';
  $('#vBody').innerHTML = `
    <div class="kv"><b>【原题】</b></div><div class="tip-out" style="margin-bottom:12px">${esc(stem)}</div>
    <div class="kv"><b>【改造后新题】</b>${isAI ? ' <span class="tag lav">AI 生成</span>' : ''}</div><div class="tip-out" style="background:#F0F9F4;border-color:#D9E8E0;margin-bottom:12px">${esc(ns)}</div>
    <div class="kv"><b>【改造说明】</b></div><ul style="margin:4px 0 12px 18px;line-height:1.9;font-size:13px">${notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
    <div class="kv"><b>【答案】</b></div><div class="tip-out" style="background:#FFF9EE;border-color:#F3E6C9">${answer ? esc(answer) : '改造后题目答案：若仅改数字，可按原解题思路代入新数值求解；配置 AI 后将由 AI 按新数值重新计算。'}</div>`;
}
function genVariantLocal(stem){
  let ns = stem, notes = [];
  if (variantActions.has('num')){
    let cnt = 0;
    ns = ns.replace(/\d+(\.\d+)?/g, m => { const n = parseFloat(m); cnt++;
      const f = 1 + (Math.random() * 0.4 - 0.2); const v = Math.max(1, Math.round(n * f * 10) / 10);
      return String(v % 1 === 0 ? v : v.toFixed(1)); });
    notes.push(`改数字：替换了 ${cnt} 处数值参数（±20%内浮动，保持解题思路不变）`); }
  if (variantActions.has('scene')){
    let cnt = 0; SCENES.forEach(([a, b]) => { if (ns.includes(a)){ ns = ns.split(a).join(b); cnt++; } });
    notes.push('换情景：替换了 ' + Math.max(cnt,1) + ' 处生活情境（考查知识点不变）'); }
  if (variantActions.has('ask')){ ns = ns.replace(/求([^，。？?]*)[？?]?/, '若将所求改为逆向求解（已知结果反求条件），$1，应如何求解？');
    notes.push('变问法：调整为逆向提问角度'); }
  if (variantActions.has('order')){ const parts = ns.split(/([，。；])/);
    if (parts.length > 4){ const i = Math.floor(parts.length / 2); const a = parts.slice(0, i), b = parts.slice(i);
      ns = b.join('') + a.join(''); notes.push('调顺序：调整了条件呈现顺序'); } else notes.push('调顺序：原题条件较短，已微调语序'); }
  if (variantActions.has('custom')){ const c = $('#vCustom').value.trim();
    ns = `（按自定义要求「${c || '自由改造'}」改写）` + ns; notes.push('自定义：' + (c || '自由改造方向')); }
  const out = { stem, ns, notes };
  renderVariantOut(stem, ns, notes, '', false);
  toast('变式题已生成（本地规则版，配置 AI 后可用真实生成）');
}
function copyVariant(){ if (!window._lastVariant) return;
  const v = window._lastVariant;
  const txt = `【原题】\n${v.stem}\n\n【改造后新题】\n${v.ns}\n\n【改造说明】\n${v.notes.join('\n')}${v.answer ? '\n\n【答案】\n' + v.answer : ''}`;
  navigator.clipboard.writeText(txt).then(() => toast('已复制改造指令')); }
function exportVariant(){ if (!window._lastVariant) return;
  const v = window._lastVariant;
  exportWord('一题多变', `<h1>一题多变</h1><p><b>【原题】</b></p><p>${esc(v.stem)}</p><p><b>【改造后新题】</b></p><p>${esc(v.ns)}</p><p><b>【改造说明】</b></p>${v.notes.map(n => `<p>· ${esc(n)}</p>`).join('')}${v.answer ? `<p><b>【答案】</b></p><p>${esc(v.answer)}</p>` : ''}`); }

regRoute('#/analysis/subject', v => {

function importSubjectScore(text){
  const cur = DB.subjectExams.find(e => e.id === subjCurId()) || DB.subjectExams[0];

  const maxQ = qIdx.reduce((a, b) => Math.max(a == null ? 0 : a, b == null ? 0 : b), 0);
  const qn = []; for (let i = 1; i <= 25; i++) if (qIdx[i] !== undefined) qn.push(i);
  if (!qn.length) return toast('未检测到“题N”小题分列', 'err');

function importPaperKnows(text){

function renderSubject(cur){

    <div class="hint" style="margin:8px 2px 0">考试：${esc(cur.name)} · ${esc(cur.date)} · ${cur.rows.length}人 · 平均分 ${avg} / 总分 ${T}</div>`;
  const avgScore = q => cur.rows.reduce((s, r) => s + (r.scores[q] || 0), 0) / cur.rows.length;
  if (subjTab === 'q'){
    const items = cur.qn.map((n, i) => { const avgS = avgScore(i); const rate = avgS / cur.maxPer[i];
      const full = cur.rows.filter(r => r.scores[i] >= cur.maxPer[i]).length;
      const zero = cur.rows.filter(r => r.scores[i] === 0).length;
      return { n, i, rate, avgS, full, zero, ok: cur.rows.length - zero }; }).sort((a, b) => a.rate - b.rate);
    body.innerHTML = `<div class="table-wrap"><table class="tb"><tr><th>题号</th><th>知识点</th><th>满分</th><th>平均分</th><th>得分率</th><th>答对/答错</th><th>满分人数</th><th>零分人数</th></tr>
      ${items.map(x => `<tr><td>题${x.n}</td><td>${esc(cur.knows[x.i] || '')}</td><td>${cur.maxPer[x.i]}</td><td>${x.avgS.toFixed(1)}</td>
      <td><div class="bar-wrap" style="width:100px;display:inline-block;vertical-align:middle"><i style="width:${x.rate * 100}%"></i></div> ${(x.rate * 100).toFixed(0)}%</td>
      <td>${x.ok} / ${cur.rows.length - x.ok}</td><td>${x.full}</td><td>${x.zero}</td></tr>`).join('')}</table></div>
      <div class="hint" style="margin-top:6px">已按得分率从低到高排序（完整清单，不限制数量）</div>`;
  } else if (subjTab === 's'){
    body.innerHTML = `<div class="table-wrap"><table class="tb"><tr><th>姓名</th>${cur.qn.map(n => `<th>题${n}</th>`).join('')}<th>总分</th></tr>
      ${cur.rows.map(r => { const low = cur.qn.map((_, i) => r.scores[i] < avgScore(i));
        return `<tr><td>${esc(r.name)}</td>${r.scores.map((s, i) => `<td ${low[i] ? 'style="background:#FDEDED;font-weight:700"' : ''}>${s}</td>`).join('')}<td><b>${r.total}</b></td></tr>`; }).join('')}</table></div>
      <div class="hint" style="margin-top:6px">红色标注：该生得分低于班级平均分的题目</div>`;
  } else if (subjTab === 'c'){
    body.innerHTML = `<div class="toolbar">分数筛选：目标分数 <input type="number" id="cX" value="${Math.round(T * 0.8)}" style="width:80px">
      <button class="btn sm" onclick="subjCritical('score')">筛选</button>
      <span class="sp"></span>等级筛选：目标等级 <select id="cL">${LEVELS.map(l => `<option ${l === 'A+' ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <button class="btn sm mint" onclick="subjCritical('level')">筛选</button></div><div id="cOut"></div>`;
  } else if (subjTab === 'k'){
    const kp = {}; cur.qn.forEach((n, i) => { const k = cur.knows[i] || '未标注'; (kp[k] = kp[k] || { sum: 0, n: 0 });
      kp[k].sum += avgScore(i) / cur.maxPer[i]; kp[k].n++; });
    const ks = Object.entries(kp).map(([k, v]) => ({ k, rate: v.sum / v.n })).sort((a, b) => b.rate - a.rate);
    body.innerHTML = `<b style="font-size:13px">班级知识点掌握度（人教新版教材）</b>
      <table class="tb" style="margin-top:6px"><tr><th>知识点</th><th>掌握度</th><th>判定</th></tr>
      ${ks.map(x => `<tr><td>${esc(x.k)}</td><td><div class="bar-wrap" style="width:140px;display:inline-block;vertical-align:middle"><i style="width:${x.rate * 100}%"></i></div> ${(x.rate * 100).toFixed(0)}%</td>
      <td>${x.rate > 0.8 ? '<span class="tag mint">优势知识点</span>' : x.rate < 0.6 ? '<span class="tag butter">薄弱知识点</span>' : '<span class="tag gray">一般</span>'}</td></tr>`).join('')}</table>
      <b style="font-size:13px;display:block;margin-top:14px">个人薄弱点清单（得分率最低的前3个知识点）</b>
      <div class="table-wrap"><table class="tb" style="margin-top:6px"><tr><th>学生</th><th>薄弱知识点（个人掌握度）</th></tr>
      ${cur.rows.map(r => { const pk = {}; cur.qn.forEach((n, i) => { const k = cur.knows[i] || '未标注'; (pk[k] = pk[k] || { s: 0, m: 0 }); pk[k].s += r.scores[i]; pk[k].m += cur.maxPer[i]; });
        const wk = Object.entries(pk).map(([k, v]) => [k, v.s / v.m]).sort((a, b) => a[1] - b[1]).slice(0, 3);
        return `<tr><td>${esc(r.name)}</td><td>${wk.map(w => `${esc(w[0])} ${(w[1] * 100).toFixed(0)}%`).join(' · ')}</td></tr>`; }).join('')}</table></div>`;
  } else if (subjTab === 'qz'){
    const rates = cur.qn.map((n, i) => avgScore(i) / cur.maxPer[i]);
    const b = rates.filter(r => r > 0.7).length, m = rates.filter(r => r >= 0.4 && r <= 0.7).length, h = rates.filter(r => r < 0.4).length;
    body.innerHTML = `<b style="font-size:13px">难度分布</b>
      <div style="margin:8px 0">基础：中档：压轴 = ${b} : ${m} : ${h}</div>
      <div class="bar-wrap" style="height:14px"><i style="width:${b / rates.length * 100}%;background:#A5D6C9"></i></div>
      <b style="font-size:13px;display:block;margin-top:16px">区分度预警</b>
      <table class="tb" style="margin-top:6px"><tr><th>类型</th><th>题号</th></tr>
      <tr><td>🟢 正确率＞90%（太简单）</td><td>${cur.qn.filter((n, i) => rates[i] > 0.9).map(n => '题' + n).join('、') || '无'}</td></tr>
      <tr><td>🔴 正确率＜30%（太难）</td><td>${cur.qn.filter((n, i) => rates[i] < 0.3).map(n => '题' + n).join('、') || '无'}</td></tr></table>`;
  } else if (subjTab === 't'){
    if (DB.subjectExams.length < 2){ body.innerHTML = `<div class="empty">历次追踪需至少2次考试成绩（当前 ${DB.subjectExams.length} 次）</div>`; return; }
    const exs = DB.subjectExams.slice().sort((a, b) => a.date < b.date ? -1 : 1);
    body.innerHTML = `<b style="font-size:13px">每位学生历次总分变化趋势（自动判断：进步/退步/波动/稳定）</b>
      <div class="table-wrap"><table class="tb" style="margin-top:6px"><tr><th>学生</th>${exs.map(e => `<th>${esc(e.name)}</th>`).join('')}<th>趋势判断</th></tr>
      ${cur.rows.map(r => { const seq = exs.map(e => { const f = e.rows.find(x => x.name === r.name); return f ? f.total : null; });
        const valid = seq.filter(v => v !== null);
        let judge = '—';
        if (valid.length >= 2){ const d = valid[valid.length - 1] - valid[0]; const sd = Math.max(...valid) - Math.min(...valid);
          judge = sd <= 5 ? '稳定' : d > 5 ? '进步' : d < -5 ? '退步' : '波动';
          judge = `<span class="tag ${judge === '进步' ? 'mint' : judge === '退步' ? 'pink' : 'gray'}">${judge}</span>`; }
        return `<tr><td>${esc(r.name)}</td>${seq.map(v => v === null ? '<td style="color:#D8C8DC">—</td>' : `<td>${v}</td>`).join('')}<td>${judge}</td></tr>`; }).join('')}</table></div>
      <b style="font-size:13px;display:block;margin-top:14px">进退步对比分析</b>
      <div class="toolbar" style="margin-top:6px">对比：<select id="cmpA">${exs.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select> ↔
      <select id="cmpB">${exs.map((e, i) => `<option value="${e.id}" ${i === exs.length - 1 ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select>
      <button class="btn sm" onclick="subjCompare()">生成对比清单</button></div><div id="cmpOut"></div>`;
  } else if (subjTab === 'w'){
    body.innerHTML = `<div class="hint" style="margin-bottom:10px">错题判定：得分低于满分即视为错题。文档结构：错题清单（无答案）→ 每题附3-5道同类变式题（无答案）→ 答案汇总页（末页）。支持单个下载或批量生成。</div>
      <div class="toolbar"><button class="btn sm" onclick="genWrongDocs(true)">📦 批量生成全部学生错题文档（逐个下载）</button>
      <button class="btn sm ghost" onclick="genWrongDocs(false)">👤 单个学生下载</button></div>
      <div class="table-wrap"><table class="tb"><tr><th>学生</th><th>错题数</th><th>错题题号</th><th>操作</th></tr>
      ${cur.rows.map(r => { const wrong = cur.qn.filter((n, i) => r.scores[i] < cur.maxPer[i]);
        return `<tr><td>${esc(r.name)}</td><td>${wrong.length}</td><td>${wrong.map(n => '题' + n).join('、') || '—'}</td>
        <td><button class="btn sm" ${!wrong.length ? 'disabled' : ''} onclick="dlWrongDoc('${esc(r.name)}')">下载Word</button></td></tr>`; }).join('')}</table></div>`;
  } else if (subjTab === 'sum'){
    const prev = DB.subjectExams.filter(e => e.id !== cur.id).sort((a, b) => b.date < a.date ? -1 : 1)[0];
    const prevAvg = prev && prev.rows.length ? (prev.rows.reduce((s, r) => s + r.total, 0) / prev.rows.length).toFixed(1) : null;
    const kp = {}; cur.qn.forEach((n, i) => { const k = cur.knows[i] || '未标注'; (kp[k] = kp[k] || { s: 0, m: 0 }); kp[k].s += avgScore(i); kp[k].m += cur.maxPer[i]; });
    const ks = Object.entries(kp).map(([k, v]) => [k, v.s / v.m]).sort((a, b) => b[1] - a[1]);
    const critical = cur.rows.filter(r => { const l = levelOf(r.total / T); return l === 'B+'; }).slice(0, 5).map(r => r.name);
    const txt = `【${cur.name}·班级总结】本次考试平均分 ${avg} 分${prevAvg ? `，较上次（${prevAvg}分）${avg > prevAvg ? '↑提高' : avg < prevAvg ? '↓下降' : '→持平'} ${Math.abs(avg - prevAvg).toFixed(1)} 分` : ''}。优势知识点：${ks.slice(0, 2).map(x => x[0]).join('、')}；薄弱知识点：${ks.slice(-2).map(x => x[0]).join('、')}。等级分布：A+ ${lv['A+']}人、A ${lv.A}人、B+ ${lv['B+']}人、B+以下 ${lv['B+以下']}人。重点关注临界生：${critical.join('、') || '暂无'}。`;
    const per = cur.rows.slice(0, 12).map(r => { const pk = {}; cur.qn.forEach((n, i) => { const k = cur.knows[i] || '未标注'; (pk[k] = pk[k] || { s: 0, m: 0 }); pk[k].s += r.scores[i]; pk[k].m += cur.maxPer[i]; });
      const w = Object.entries(pk).map(([k, v]) => [k, v.s / v.m]).sort((a, b) => b[1] - a[1]);
      return `【${r.name}·个体总结】总分 ${r.total} 分（${levelOf(r.total / T)}），强势知识点：${w[0][0]}；薄弱知识点：${w[w.length - 1][0]}。建议：针对薄弱知识点安排变式题练习，每周完成一次错题重做。`; }).join('\n');
    body.innerHTML = `<div class="tip-out" id="sumTxt">${esc(txt)}\n\n${esc(per)}</div>
      <div style="margin-top:10px"><button class="btn sm" onclick="navigator.clipboard.writeText($('#sumTxt').innerText).then(()=>toast('已复制'))">📋 复制总结</button></div>`;
  }
}
function subjCritical(mode){
  const cur = DB.subjectExams.find(e => e.id === subjCurId()) || DB.subjectExams[0];
  const T = cur.totalScore || cur.maxPer.reduce((a, b) => a + b, 0);
  let list = [];
  if (mode === 'score'){ const x = +$('#cX').value;
    list = cur.rows.filter(r => r.total >= x - 5 && r.total <= x - 1).map(r => ({ ...r, gap: r.total - x })); }
  else { const l = $('#cL').value; const li = LEVELS.indexOf(l); const next = LEVELS[Math.min(li + 1, LEVELS.length - 1)];
    list = cur.rows.filter(r => levelOf(r.total / T) === next).slice(0, 5).map(r => ({ ...r, gap: Math.round(T * ({ 'A+': 0.9, 'A': 0.8, 'B+': 0.7, 'B': 0.6, 'B-': 0.5, 'C+': 0.4, 'C': 0.3 })[l]) - r.total })); }
  $('#cOut').innerHTML = list.length ? `<table class="tb"><tr><th>学生姓名</th><th>总分</th><th>距目标线差值</th><th>提分建议</th></tr>
    ${list.map(r => `<tr><td>${esc(r.name)}</td><td>${r.total}</td><td style="color:${r.gap < 0 ? '#C0392B' : '#3D7A62'}">${r.gap > 0 ? '+' : ''}${r.gap} 分</td>
    <td class="hint">优先补弱科知识点，完成错题变式训练，课堂增加提问频次</td></tr>`).join('')}</table>`
    : `<div class="empty">未筛选到符合条件的临界生</div>`;
}
function subjCompare(){
  const a = DB.subjectExams.find(e => e.id === $('#cmpA').value), b = DB.subjectExams.find(e => e.id === $('#cmpB').value);
  if (!a || !b || a.id === b.id) return toast('请选择两次不同的考试', 'warn');
  const rank = ex => { const s = ex.rows.slice().sort((x, y) => y.total - x.total); return Object.fromEntries(s.map((r, i) => [r.name, i + 1])); };
  const ra = rank(a), rb = rank(b);
  const rows = a.rows.map(r => { const fb = b.rows.find(x => x.name === r.name); if (!fb) return null;
    return { name: r.name, d: fb.total - r.total, dr: (ra[r.name] || 99) - (rb[r.name] || 99) }; }).filter(Boolean).sort((x, y) => y.d - x.d);
  $('#cmpOut').innerHTML = `<div class="hint" style="margin:4px 0">「${esc(b.name)}」对比「${esc(a.name)}」· 默认按进步幅度从高到低排序</div>
    <table class="tb"><tr><th>学生</th><th>进退分</th><th>名次变化</th><th>判定</th></tr>
    ${rows.map(r => `<tr><td>${esc(r.name)}</td><td style="color:${r.d > 0 ? '#3D7A62' : r.d < 0 ? '#C0392B' : ''}">${r.d > 0 ? '+' : ''}${r.d}</td>
    <td>${r.dr > 0 ? '↑' + r.dr : r.dr < 0 ? '↓' + (-r.dr) : '—'}</td><td>${r.d > 3 ? '<span class="tag mint">进步</span>' : r.d < -3 ? '<span class="tag pink">退步</span>' : '<span class="tag gray">持平</span>'}</td></tr>`).join('')}</table>`;
}
function wrongDocHTML(exam, stu){
  const wrong = exam.qn.map((n, i) => ({ n, i })).filter(x => stu.scores[x.i] < exam.maxPer[x.i]);
  let h = `<h2>${esc(stu.name)} · ${esc(exam.name)} 错题文档</h2><h3>一、错题清单（仅题目）</h3>`;
  wrong.forEach((w, idx) => { h += `<p>${idx + 1}.（原卷题${w.n}，知识点：${esc(exam.knows[w.i] || '')}）题干：请参照原试卷第${w.n}题。</p>`;
    const sim = DB.bank.questions.filter(q => q.chapter === (exam.knows[w.i] || '')).slice(0, 3);
    h += `<p><b>同类变式题：</b></p>`;
    if (sim.length) sim.forEach((q, i) => { h += `<p>变式${i + 1}：${esc(q.stem)}</p>`; });
    else h += `<p>变式1：与原题同知识点、改变数值的同类题；变式2：改变情境、保留考法的应用题；变式3：逆向设问的变式题。（可在「一题多变」中粘贴原题生成具体内容）</p>`; });
  h += `<h3>二、答案汇总页（最后一页）</h3>`;
  wrong.forEach(w => { h += `<p>题${w.n} 正确答案：请参照原卷答案（该生此题得分 ${stu.scores[w.i]}/${exam.maxPer[w.i]}）。变式题答案解析：由 AI 生成或参照同类题解析。</p>`; });
  return h;
}
function dlWrongDoc(name){
  const cur = DB.subjectExams.find(e => e.id === subjCurId()) || DB.subjectExams[0];
  const stu = cur.rows.find(r => r.name === name); if (!stu) return;
  exportWrongHTML(wrongDocHTML(cur, stu), `${name}_错题文档`);
}
function exportWrongHTML(html, name){ exportWord(name, html); }
function genWrongDocs(batch){
  const cur = DB.subjectExams.find(e => e.id === subjCurId()) || DB.subjectExams[0];
  const list = cur.rows.filter(r => cur.qn.some((n, i) => r.scores[i] < cur.maxPer[i]));
  if (!list.length) return toast('当前没有学生有错题', 'warn');
  if (batch){ let i = 0; toast('开始批量下载 ' + list.length + ' 份错题文档');
    const next = () => { if (i >= list.length) return toast('批量下载完成（如需ZIP打包请在对话中说明）');
      dlWrongDoc(list[i].name); i++; setTimeout(next, 700); }; next(); }
  else openModal('选择学生', `<div style="max-height:300px;overflow:auto">${list.map(r => `
    <div class="todo-item"><div class="t"><b>${esc(r.name)}</b><span>错题 ${cur.qn.filter((n, i) => r.scores[i] < cur.maxPer[i]).length} 道</span></div>
    <button class="btn sm" onclick="closeModal();dlWrongDoc('${esc(r.name)}')">下载</button></div>`).join('')}</div>`);
}

/* ---------------- 4.2 班级成绩 ---------------- */
const SUBJECTS = ['语文','数学','英语','物理','化学','历史','道法','体育'];
let clsTab = 'dash';
regRoute('#/analysis/class', v => {
  const cur = DB.classExams.find(e => e.id === sessionStorage.getItem('ceCur')) || DB.classExams[0];

      <select id="ceSel">${DB.classExams.map(e => `<option value="${e.id}" ${cur && e.id === cur.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('') || '<option>暂无考试</option>'}</select>

  <div id="ceDash"></div>
  <div class="card no-print"><div class="tabs">
    ${[['dash','总览看板'],['sort','多维度排序'],['sub','班级各科情况'],['stu','学生个体诊断'],['c','临界生'],['t','历次追踪'],['sum','一句话总结']]
      .map(t => `<button class="tab ${clsTab === t[0] ? 'on' : ''}" onclick="clsTab='${t[0]}';go('#/analysis/class')">${t[1]}</button>`).join('')}</div>
    <div id="ceBody"></div></div>`;

function addClassExam(){
  openModal('新增考试', `<div class="grid g2"><div class="field"><label class="fl">考试名称</label><input type="text" id="neName" placeholder="如：九上期中（全科）"></div>
    <div class="field"><label class="fl">考试日期</label><input type="date" id="neDate" value="${todayStr()}"></div></div>
    <div style="text-align:right"><button class="btn" onclick="saveClassExam()">创建</button></div>`); }
function saveClassExam(){ const name = $('#neName').value.trim(); if (!name) return toast('请填写名称', 'warn');
  const e = { id: uid(), name, date: $('#neDate').value, rows: [] }; DB.classExams.push(e); dbSave();
  sessionStorage.setItem('ceCur', e.id); closeModal(); go('#/analysis/class'); }
function importClassScore(text){
  const cur = DB.classExams.find(e => e.id === sessionStorage.getItem('ceCur')) || DB.classExams[0];
  if (!cur) return toast('请先新增一场考试', 'warn');
  const rows = parseCSV(text); if (rows.length < 2) return toast('数据为空', 'err');
  const head = rows[0].map(h => h.trim());
  const ni = head.findIndex(h => h.includes('姓名'));
  if (ni < 0) return toast('成绩表需包含“姓名”列', 'err');
  cur.rows = rows.slice(1).map(r => { const subj = {}; SUBJECTS.forEach(s => { const i = head.findIndex(h => h.includes(s));
      if (i >= 0 && r[i] !== '' && r[i] !== undefined) subj[s] = parseFloat(r[i]) || 0; });
    const ti = head.findIndex(h => h.includes('总分'));
    const total = ti >= 0 ? parseFloat(r[ti]) || 0 : Object.values(subj).reduce((a, b) => a + b, 0);
    const lvls = {}; SUBJECTS.forEach(s => { const i = head.findIndex(h => h.includes(s + '等级'));
      if (i >= 0) lvls[s] = r[i]; });
    return { name: String(r[ni] || '').trim(), subj, levels: lvls, total }; }).filter(r => r.name);
  dbSave(); toast('已导入 ' + cur.rows.length + ' 名学生全科成绩'); go('#/analysis/class');
}
function clearClassExam(){ const cur = DB.classExams.find(e => e.id === sessionStorage.getItem('ceCur')); if (!cur) return;

function renderClass(cur){

  const lv = { 'A+': 0, 'A': 0, 'B+': 0, 'B+以下': 0 };

  cur.rows.forEach(r => { const l = levelOf(r.total / MAX); if (l === 'A+') lv['A+']++; else if (l === 'A') lv.A++; else if (l === 'B+') lv['B+']++; else lv['B+以下']++; });

    <div class="stat-card"><div class="num">${lv['A+']}</div><div class="lab">A+ 人数</div></div>

  const avgSub = s => cur.rows.reduce((a, r) => a + (r.subj[s] || 0), 0) / cur.rows.filter(r => r.subj[s] !== undefined).length;
  if (clsTab === 'dash'){ body.innerHTML = `<div class="hint">考试：${esc(cur.name)} · ${esc(cur.date)} · ${cur.rows.length}人</div>`; }
  else if (clsTab === 'sort'){
    let key = 'total';
    window.clsSortKey = k => { key = k; go('#/analysis/class'); };
    body.innerHTML = `<div class="toolbar">${['总分', ...SUBJECTS].map(s => `<button class="tab ${key === (s === '总分' ? 'total' : s) ? 'on' : ''}" onclick="clsSortKey('${s === '总分' ? 'total' : s}')">${s}</button>`).join('')}</div>
      <div class="table-wrap"><table class="tb"><tr><th>名次</th><th>姓名</th><th>总分</th>${SUBJECTS.map(s => `<th>${s}</th>`).join('')}</tr>
      ${cur.rows.slice().sort((a, b) => (b.subj[key] ?? b.total) - (a.subj[key] ?? a.total)).map((r, i) => `
        <tr><td>${i + 1}</td><td>${esc(r.name)}</td><td><b>${key === 'total' ? r.total : r.total}</b></td>
        ${SUBJECTS.map(s => `<td>${r.subj[s] ?? '—'}</td>`).join('')}</tr>`).join('')}</table></div>`;
  } else if (clsTab === 'sub'){
    body.innerHTML = `<table class="tb"><tr><th>科目</th><th>平均分</th><th>最高分</th><th>最低分</th><th>优秀率</th><th>及格率</th><th>判定（对比预设年级均值）</th></tr>
      ${SUBJECTS.filter(s => cur.rows.some(r => r.subj[s] !== undefined)).map(s => { const vs = cur.rows.map(r => r.subj[s]).filter(v => v !== undefined);
        const avg = vs.reduce((a, b) => a + b, 0) / vs.length;
        const gra = 78; // 预设年级平均，可在对话中修改
        return `<tr><td>${s}</td><td>${avg.toFixed(1)}</td><td>${Math.max(...vs)}</td><td>${Math.min(...vs)}</td>
        <td>${(vs.filter(v => v >= 90).length / vs.length * 100).toFixed(0)}%</td><td>${(vs.filter(v => v >= 60).length / vs.length * 100).toFixed(0)}%</td>
        <td>${avg > gra ? '<span class="tag mint">优势科目（高于年级平均）</span>' : '<span class="tag butter">薄弱科目（低于年级平均）</span>'}</td></tr>`; }).join('')}</table>
      <div class="hint" style="margin-top:6px">年级平均分预设为78分，如需修改请在对话中说明</div>`;
  } else if (clsTab === 'stu'){
    body.innerHTML = `<div class="table-wrap"><table class="tb"><tr><th>姓名</th>${SUBJECTS.map(s => `<th>${s}</th>`).join('')}<th>总分</th><th>诊断</th></tr>
      ${cur.rows.map(r => { const diag = SUBJECTS.filter(s => r.subj[s] !== undefined).map(s => { const a = avgSub(s);
          return r.subj[s] > a * 1.1 ? { s, t: '强' } : r.subj[s] < a * 0.9 ? { s, t: '弱' } : null; }).filter(Boolean);
        return `<tr><td>${esc(r.name)}</td>${SUBJECTS.map(s => r.subj[s] === undefined ? '<td>—</td>' : {
          val: `<td ${diag.some(d => d.s === s) ? `style="font-weight:700;color:${diag.find(d => d.s === s).t === '强' ? '#3D7A62' : '#C0392B'}"` : ''}>${r.subj[s]}</td>` }).join('')}</td>
        <td><b>${r.total}</b></td><td class="hint">${diag.length ? diag.map(d => `${d.s}${d.t === '强' ? '▲' : '▼'}`).join(' ') : '均衡'} · ${diag.some(d => d.t === '弱') ? '建议优先补' + diag.filter(d => d.t === '弱').map(d => d.s).join('、') + '，安排针对性练习' : '保持节奏，可适当拓展提升'}</td></tr>`; }).join('')}</table></div>
      <div class="hint" style="margin-top:6px">▲强势科目（高于班均10%）· ▼弱势科目（低于班均10%）</div>`;
  } else if (clsTab === 'c'){
    body.innerHTML = `<div class="toolbar">分数筛选：目标总分 <input type="number" id="cX" value="${Math.round(MAX * 0.8)}" style="width:90px">
      <button class="btn sm" onclick="clsCritical()">筛选</button></div><div id="cOut2"></div>`;
  } else if (clsTab === 't'){
    if (DB.classExams.length < 2){ body.innerHTML = `<div class="empty">历次追踪需至少2次考试成绩（当前 ${DB.classExams.length} 次）</div>`; return; }
    const exs = DB.classExams.slice().sort((a, b) => a.date < b.date ? -1 : 1);
    body.innerHTML = `<table class="tb"><tr><th>学生</th>${exs.map(e => `<th>${esc(e.name)}</th>`).join('')}<th>趋势</th></tr>
      ${cur.rows.map(r => { const seq = exs.map(e => { const f = e.rows.find(x => x.name === r.name); return f ? f.total : null; });
        const valid = seq.filter(v => v !== null); let j = '—';
        if (valid.length >= 2){ const d = valid[valid.length - 1] - valid[0]; const sd = Math.max(...valid) - Math.min(...valid);
          const t = sd <= 15 ? '稳定' : d > 15 ? '进步' : d < -15 ? '退步' : '波动';
          j = `<span class="tag ${t === '进步' ? 'mint' : t === '退步' ? 'pink' : 'gray'}">${t}</span>`; }
        return `<tr><td>${esc(r.name)}</td>${seq.map(v => v === null ? '<td style="color:#D8C8DC">—</td>' : `<td>${v}</td>`).join('')}<td>${j}</td></tr>`; }).join('')}</table>`;
  } else if (clsTab === 'sum'){
    const avg = (cur.rows.reduce((s, r) => s + r.total, 0) / cur.rows.length).toFixed(1);
    const subAvg = SUBJECTS.filter(s => cur.rows.some(r => r.subj[s] !== undefined)).map(s => [s, avgSub(s)]).sort((a, b) => b[1] - a[1]);
    const crit = cur.rows.filter(r => levelOf(r.total / MAX) === 'B+').slice(0, 5).map(r => r.name);
    const txt = `【${cur.name}·班级总结】班级总分平均 ${avg} 分。优势科目：${subAvg[0][0]}；薄弱科目：${subAvg[subAvg.length - 1][0]}。等级分布：A+ ${lv['A+']}人、A ${lv.A}人、B+ ${lv['B+']}人、B+以下 ${lv['B+以下']}人。重点关注临界生：${crit.join('、') || '暂无'}。`;
    body.innerHTML = `<div class="tip-out" id="sumTxt2">${esc(txt)}\n${cur.rows.map(r => `【${r.name}】总分 ${r.total}，强势：${SUBJECTS.filter(s => r.subj[s] > avgSub(s) * 1.1).join('、') || '均衡'}；弱势：${SUBJECTS.filter(s => r.subj[s] < avgSub(s) * 0.9).join('、') || '无'}。建议：${SUBJECTS.filter(s => r.subj[s] < avgSub(s) * 0.9).length ? '与科任老师联动，制定弱势科目周计划' : '保持当前学习节奏'}。`).join('\n')}</div>
      <div style="margin-top:10px"><button class="btn sm" onclick="navigator.clipboard.writeText($('#sumTxt2').innerText).then(()=>toast('已复制'))">📋 复制总结</button></div>`;
  }
}
function clsCritical(){
  const cur = DB.classExams.find(e => e.id === sessionStorage.getItem('ceCur')) || DB.classExams[0];
  const x = +$('#cX').value;
  const list = cur.rows.filter(r => r.total >= x - 5 && r.total <= x - 1).map(r => ({ ...r, gap: r.total - x }));
  $('#cOut2').innerHTML = list.length ? `<table class="tb"><tr><th>学生姓名</th><th>总分</th><th>距目标线差值</th><th>提分建议</th></tr>
    ${list.map(r => `<tr><td>${esc(r.name)}</td><td>${r.total}</td><td style="color:#C0392B">${r.gap} 分</td>
    <td class="hint">${SUBJECTS.filter(s => r.subj[s] < avgSub2(cur, s) * 0.9).join('、') || '整体'}待提升，建议科任联动+每日小任务打卡</td></tr>`).join('')}</table>`
    : `<div class="empty">未筛选到符合条件的临界生（等级筛选：目标等级下一等级前5名，可在对话中说明目标等级）</div>`;
}
function avgSub2(exam, s){ const vs = exam.rows.map(r => r.subj[s]).filter(v => v !== undefined);
  return vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : 0; }

<script>

/* ---------------- 5.1 学生信息 ---------------- */
regRoute('#/class/students', v => {
  const boys = DB.students.filter(s => s['性别'] === '男').length;

  v.innerHTML = `

    <div class="grid g4" style="margin-bottom:12px">

  $('#stuKw').oninput = $('#stuSex').onchange = $('#stuHk').onchange = renderStudents;

  renderStudents();
});
function importStudents(text){
  const rows = parseCSV(text); if (rows.length < 2) return toast('数据为空', 'err');
  const map = matchHeaders(rows[0], STU_FIELDS.map(f => f[1]));
  const missing = STU_FIELDS.filter(f => map[f[1]] === undefined && ['学号','姓名','性别','出生日期'].includes(f[0]));
  const doImport = () => {
    const data = rows.slice(1).map(r => { const o = {}; STU_FIELDS.forEach(f => { if (map[f[1]] !== undefined) o[f[0]] = String(r[map[f[1]]] || '').trim(); });
      return o; }).filter(o => o['姓名']);
    const imp = window._stuMode === 'cover' ? data : DB.students.concat(data);
    const ok = data.length, fail = rows.length - 1 - ok;
    DB.students = imp; dbSave(); toast(`导入完成：成功 ${ok} 行${fail > 0 ? '，失败/跳过 ' + fail + ' 行' : ''}`);
    closeModal(); go('#/class/students'); };
  openModal('选择导入模式（已识别 ' + (rows.length - 1) + ' 行数据）', `
    ${missing.length ? `<div class="hint" style="color:#C0392B;margin-bottom:8px">⚠️ 未能自动匹配字段：${missing.map(m => m[0]).join('、')}，缺失字段将留空，可导入后手动编辑</div>` : ''}
    <div class="grid g2"><div class="stat-card" style="cursor:pointer" onclick="window._stuMode='append'"><b>➕ 增量导入</b><div class="hint">追加新数据到已有名单</div></div>
    <div class="stat-card lav" style="cursor:pointer" onclick="window._stuMode='cover'"><b>🔄 覆盖导入</b><div class="hint">替换已有全部数据</div></div></div>
    <div style="text-align:right;margin-top:12px"><button class="btn" onclick="window._stuMode=window._stuMode||'append';(function(){closeModal();})()">取消</button></div>`);
  $$('[onclick^="window._stuMode"]').forEach(el => { const m = el.getAttribute('onclick').includes('append') ? 'append' : 'cover';
    el.onclick = () => { window._stuMode = m; doImport(); }; });
}
function renderStudents(){
  const el = $('#stuList'); if (!el) return;
  const kw = $('#stuKw').value.trim(), sex = $('#stuSex').value, hk = $('#stuHk').value;

    ${list.map(s => { const i = DB.students.indexOf(s);
